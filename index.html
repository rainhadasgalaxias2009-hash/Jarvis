<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<title>J.A.R.V.I.S</title>
<style>

</style>
<script>
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ac:#2fd8ff;--ac2:#7dffb2;--acr:47,216,255;--ac2r:125,255,178;--fg:#dff8ff;--mut:#6aa6c2;--hud:Orbitron,system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000308}
body{height:100dvh;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.16) 4px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.65) 100%)}
#neb{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 40% at 50% 28%,rgba(var(--acr),.22),transparent 70%),radial-gradient(50% 35% at 8% 92%,rgba(var(--ac2r),.1),transparent 70%),radial-gradient(50% 35% at 96% 70%,rgba(var(--acr),.12),transparent 70%),#000308}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

body.alert #fl{animation:al .7s ease-in-out infinite alternate}
@keyframes al{from{opacity:0}to{opacity:1;box-shadow:inset 0 0 160px rgba(255,40,40,.8)}}
header{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 14px 0;flex:none}
.logo{display:flex;align-items:center;gap:9px;font:900 11px var(--hud);letter-spacing:.42em;color:var(--ac);text-shadow:0 0 10px var(--ac)}
.logo i{width:11px;height:11px;background:var(--ac);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 4px var(--ac))}
.hx{position:relative;width:58px;height:66px;border:0;padding:0;background:var(--ac);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);color:var(--ac);font:700 6.5px var(--hud);letter-spacing:.06em;flex:none}
.hx::before{content:"";position:absolute;inset:1.5px;background:linear-gradient(#05182a,#020a12);clip-path:inherit}

#rc{width:100%;height:100%;display:block}

.dv::before,.dv::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--acr),.8))}

#shb{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}

.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid rgba(var(--acr),.16);font:13px var(--mono);letter-spacing:.05em}

.sw{position:relative;width:48px;height:26px;border-radius:13px;border:1.5px solid var(--ac);background:transparent;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--mut);transition:.25s}
.sw.on{background:rgba(var(--acr),.28)}
.sw.on::after{left:25px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.tds{display:flex;gap:9px}
.td{width:28px;height:28px;border-radius:50%;border:2px solid transparent;display:block}
.td.sel{border-color:#fff;box-shadow:0 0 12px currentColor}
.sb{border:0;color:var(--ac);background:rgba(var(--acr),.16);font:700 10px var(--hud);letter-spacing:.14em;padding:9px 16px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.bt3{display:flex;gap:7px}
.rb{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ac);background:transparent;color:var(--ac);font-size:13px;padding:0}

.tk{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid rgba(var(--acr),.14);font-size:15px}

.tk.dn span{text-decoration:line-through;opacity:.45}
.rm{color:var(--mut);font-weight:400;padding:4px 8px}
.ad{display:flex;gap:8px;margin-top:14px}
.ad input{flex:1;min-width:0;border:0;outline:0;background:rgba(var(--acr),.1);color:var(--fg);font:16px var(--mono);padding:12px 20px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.ad button{width:44px;border:0;background:var(--ac);color:#012;font:700 20px var(--hud);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hu{font:13px/1.5 var(--mono);color:var(--mut);margin:12px 0 2px}
.hj{font-size:15px;line-height:1.5;color:#eafcff;margin-bottom:6px}
.wx{display:flex;align-items:center;justify-content:center;gap:18px}
.wt{font:900 54px var(--hud);color:var(--ac);text-shadow:0 0 18px var(--ac)}
.wi{font-size:48px}
.wd{text-align:center;color:var(--mut);font:13px var(--mono);margin:4px 0 12px}
.wm{display:flex;justify-content:space-around;font:10px var(--hud);letter-spacing:.12em;color:var(--mut)}
.wm b{display:block;color:var(--fg);font-size:13px;margin-top:4px}
.fc{display:flex;justify-content:space-around;margin-top:18px}
.ob{width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(var(--acr),.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 0 16px rgba(var(--acr),.18)}
.ob small{font:700 9px var(--hud);letter-spacing:.16em;color:var(--ac)}.ob b{font-size:20px;font-weight:400}.ob span{font:10px var(--mono);color:var(--mut)}
.mk{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid rgba(var(--acr),.14);font:14px var(--mono)}
.sy{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ac);display:flex;align-items:center;justify-content:center;font:700 10px var(--hud);color:var(--ac);font-style:normal;flex:none}
.mk span{flex:1}.mk b{font-weight:400}.mk em{font-style:normal;width:80px;text-align:right}
.up{color:var(--ac2)}.dn2{color:#ff6b6b}
#boot{position:fixed;inset:0;z-index:50;background:#000;clip-path:circle(150% at 50% 30%);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
#bc{position:absolute;inset:0;width:100%;height:100%}
#bt{position:absolute;left:0;right:0;text-align:center;font:900 clamp(14px,5vw,20px) var(--hud);letter-spacing:.32em;color:#e8fbff;text-shadow:0 0 14px var(--ac),0 0 34px var(--ac);transform:translateY(-50%);padding-left:.32em}
#bt.idle{animation:bk 1.3s infinite;font-size:11px;color:var(--ac)}
@keyframes bk{50%{opacity:.25}}
#bl{position:absolute;left:50%;transform:translateX(-50%);font:500 10px var(--mono);letter-spacing:.14em;color:var(--ac2);white-space:pre;text-align:left;line-height:18px;text-shadow:0 0 8px rgba(var(--ac2r),.5)}
#bp{position:absolute;left:50%;transform:translateX(-50%);width:min(70vw,260px);height:3px;background:rgba(var(--acr),.15);opacity:0}
#bp i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 12px var(--ac)}
#bs{position:absolute;left:0;right:0;text-align:center;font:900 clamp(12px,4vw,16px) var(--hud);letter-spacing:.3em;color:var(--ac2);text-shadow:0 0 16px var(--ac2);opacity:0}
#bs.on{opacity:1;animation:gt .5s steps(2) 2}
@keyframes gt{0%{transform:translate(0)}25%{transform:translate(-4px,1px);filter:hue-rotate(60deg)}50%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}100%{transform:none}}
#sk{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:500 9px var(--hud);letter-spacing:.3em;color:#5d9bb8;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<div id="neb"></div>
<canvas id="bgc"></canvas>
<div id="fl"></div>
<header><div class="logo"><i></i>J.A.R.V.I.S</div><button class="hx sm" id="gear"><span><b>⚙</b></span></button></header>
<div id="tms"></div>
<div id="reactor"><canvas id="rc"></canvas></div>
<div id="st">AGUARDANDO COMANDO</div>
<div class="dv"><i></i></div>
<div id="cap"><div id="cu"></div><div id="cj"></div><div id="act"></div></div>
<form id="tb"><input id="t" type="text" placeholder="Digite um comando…" autocomplete="off"><button class="hx sm"><span><b>➤</b></span></button></form>
<nav id="dock">
<button class="hx" data-k="clima"><span><b>🌤</b>CLIMA</span></button>
<button class="hx" data-k="tarefas"><span><b>✅</b>TAREFAS</span></button>
<button class="hx big" data-k="txt"><span><b>⌨</b>TEXTO</span></button>
<button class="hx" data-k="mem"><span><b>🧠</b>MEMÓRIA</span></button>
<button class="hx" data-k="mkt"><span><b>💱</b>MERCADO</span></button>
</nav>
<div id="sh"><div id="shd"></div><div id="shp"><div id="sht"></div><button id="shx">+</button><div id="shb"></div></div></div>
<input type="file" id="fi" accept="audio/*" hidden>
<div id="boot"><canvas id="bc"></canvas><div id="bt" class="idle">TOQUE PARA INICIAR</div><div id="bl"></div><div id="bp"><i></i></div><div id="bs">BEM-VINDO, SENHOR</div><div id="sk">TOQUE PARA PULAR</div></div>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem('jp_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('jp_'+k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ease=x=>1-Math.pow(1-x,3);
const DPR=Math.min(2,window.devicePixelRatio||1);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const AND=/android/i.test(navigator.userAgent),IOS=/iphone|ipad/i.test(navigator.userAgent);
let hist=ld('hist',[]),mem=ld('mem',[]),tasks=ld('tasks',[]),chat=ld('chat',[]),timers=[],wl=null;
let listening=false,speaking=false,think=false,contOn=false,ambOn=false,rec=null,sample=null,voice=null,fxOn=ld('fx',true),vol=ld('vol',.8);
let lvl=0,bump=0,rot=0,bRot=0,rips=[],introT=-1e9,mainDraw=false;
while(hist.length&&hist[0].role!=='user')hist.shift();
const setSt=t=>{$('#st').textContent=t};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[?!.,]/g,'').trim();
const lista=(a,f)=>a.map((x,i)=>(i+1)+'. '+f(x)).join('. ');
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s%60).padStart(2,'0')};
const lbl=s=>s>=3600?Math.round(s/3600)+' hora'+(s>=7200?'s':''):s>=60?Math.round(s/60)+' minuto'+(s>=120?'s':''):s+' segundo'+(s>1?'s':'');

/* ===== TEMAS ===== */
const TH={azul:['#2fd8ff','#7dffb2'],vermelho:['#ff3b3b','#ffb04a'],dourado:['#ffc233','#fff0a0'],roxo:['#b46bff','#ff8ae2'],verde:['#2cff8a','#d9ff7a']};
const h2r=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(',');
let ACR='47,216,255',AC2R='125,255,178',curTheme='azul';
function setTheme(n,save=true){const p=TH[n];if(!p)return;curTheme=n;const r=document.documentElement.style;
  r.setProperty('--ac',p[0]);r.setProperty('--ac2',p[1]);r.setProperty('--acr',ACR=h2r(p[0]));r.setProperty('--ac2r',AC2R=h2r(p[1]));if(save)sv('th',n)}
setTheme(TH[ld('th','azul')]?ld('th','azul'):'azul',false);

/* ===== SONS (arquivos do usuário + reserva simples) ===== */
const SLOTS=[['boot','Abertura','Futuristic space intro'],['click','Toque nos botões','Sci fi click'],['listen','Começou a ouvir','Sci Fi confirmation'],['send','Comando enviado','Fast sci fi bleep'],['reply','Resposta do Jarvis','Sci fi interface robot click'],['ok','Ação concluída','Cybernetic technology affirmation'],['err','Erro','Sci-Fi reject notification'],['scan','Varredura e alerta vermelho','Scanning sci fi alarm'],['alert','Timer terminou','Technology alert transition'],['theme','Trocar tema','Fast sci fi transition sweep'],['open','Abrir painel','Sci Fi interface zoom'],['amb','Ambiente (repete)','Futuristic Sci Fi computer ambience']];
const SU={};
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('jarvis_sons',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
const idbGet=async k=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}};
const idbSet=async(k,v)=>{try{const d=await idb();await new Promise(ok=>{const tx=d.transaction('s','readwrite'),os=tx.objectStore('s');v?os.put(v,k):os.delete(k);tx.oncomplete=ok;tx.onerror=ok})}catch(e){}};
async function loadSounds(){for(const s of SLOTS){const k=s[0],b=await idbGet(k);
  if(b){SU[k]=URL.createObjectURL(b);continue}
  try{const r=await fetch('sons/'+k+'.mp3',{method:'HEAD'});if(r.ok)SU[k]='sons/'+k+'.mp3'}catch(e){}}}
let AX=null,humN=null;
function ax(){if(!AX){try{AX=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AX.state==='suspended')AX.resume();return AX}
function bp(f1,f2,d,v,type){const x=ax();if(!x)return;const t=x.currentTime,o=x.createOscillator(),g=x.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*vol),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(x.destination);o.start(t);o.stop(t+d+.05)}
const FB={click:()=>bp(2200,3200,.05,.05),listen:()=>{bp(500,1400,.18,.08);setTimeout(()=>bp(1400,2100,.15,.06),90)},send:()=>bp(1800,900,.1,.06),reply:()=>bp(900,1300,.07,.05),ok:()=>{bp(900,0,.12,.07);setTimeout(()=>bp(1350,0,.18,.07),110)},err:()=>bp(300,120,.3,.1,'sawtooth'),scan:()=>bp(300,3000,.9,.05,'triangle'),alert:()=>{for(let i=0;i<3;i++)setTimeout(()=>bp(1200,0,.2,.1),i*300)},theme:()=>bp(200,2400,.6,.05,'triangle'),open:()=>bp(400,1200,.15,.05),boot:()=>{bp(60,30,1.8,.3);bp(200,2800,2.4,.05,'sawtooth');setTimeout(()=>{bp(660,0,1.2,.08);bp(990,0,1.4,.06)},4500)}};
function play(k,o){o=o||{};if(!fxOn&&!o.force)return;const u=SU[k];
  if(u){try{const a=new Audio(u);a.volume=Math.min(1,vol*(o.v||1));a.play().catch(()=>{});return a}catch(e){return}}
  if(FB[k]){try{FB[k]()}catch(e){}}}
let ambA=null;
function ambient(on){ambOn=on;
  if(on){if(SU.amb){ambA=new Audio(SU.amb);ambA.loop=true;ambA.volume=vol*.5;ambA.play().catch(()=>{})}

function pick(){const v=ptVoices();voice=v.find(x=>x.name===voiceName)||v.find(x=>/male|masc|ricardo|daniel|felipe|antonio|luciano|diego|HD/i.test(x.name)&&!/female|feminin/i.test(x.name))||v[0]||speechSynthesis.getVoices().find(x=>/^pt/i.test(x.lang))||null}

function cycleVoice(){const v=ptVoices();if(!v.length){say('Seu celular não tem voz em português instalada, senhor.');return}voice=v[vi++%v.length];try{localStorage.setItem('jv',voice.name)}catch(e){}speak('Esta é a voz '+voice.name+'. Deseja mantê-la?')}
function speak(t){
  if(!('speechSynthesis' in window))return Promise.resolve();
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  const parts=t.replace(/[*#_`]/g,'').match(/[^.!?…]+[.!?…]*/g)||[t];
  return new Promise(res=>{let i=0;
    const end=()=>{speaking=false;if(!listening&&!think)setSt('AGUARDANDO COMANDO');res()};
    const next=()=>{if(i>=parts.length)return end();
      const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang='pt-BR';if(voice)u.voice=voice;u.rate=.93;u.pitch=.6;u.volume=1;
      u.onstart=()=>{speaking=true;setSt('FALANDO')};
      u.onend=()=>setTimeout(next,160);
      u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled'){i=parts.length;return end()}
        if(!u._r){u._r=1;const v=new SpeechSynthesisUtterance(u.text);v.lang='pt-BR';v.onend=()=>setTimeout(next,160);v.onerror=()=>{i=parts.length;end()};speechSynthesis.speak(v)}};
      speechSynthesis.speak(u)};
    next()})}

function calc(raw){
  let e=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  e=e.replace(/^(quanto e|quanto da|quanto fica|calcule|calcular|calcula)\s*/,'').replace(/,/g,'.');
  e=e.replace(/(\d+(?:\.\d+)?)\s*(?:por cento|%)\s*de\s*(\d+(?:\.\d+)?)/g,'($1/100*$2)');
  e=e.replace(/dividido por|dividido/g,'/').replace(/multiplicado por|vezes|\bx\b/g,'*').replace(/mais/g,'+').replace(/menos/g,'-');
  e=e.replace(/[?=!]+$/,'').replace(/\s+/g,'');
  if(!/^[\d+\-*/().]+$/.test(e))return null;
  try{const v=Function('return('+e+')')();
    if(!isFinite(v))return say('Isso resultaria em divisão por zero, senhor. O universo agradece que eu não tenha tentado.');
    return say('O resultado é '+(Math.round(v*1e6)/1e6).toLocaleString('pt-BR')+', senhor.')}catch(x){return null}}

function local(raw){
  const s=norm(raw);let m;
  if(/que horas/.test(s))return say('Agora são '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+', senhor.');
  if(/que dia|data de hoje/.test(s))return say('Hoje é '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+', senhor.');
  if(/^(parar|para|silencio|calar)$/.test(s)){try{speechSynthesis.cancel()}catch(e){}return Promise.resolve(1)}
  if(/^(limpar|esquecer)( conversa| tudo)?$/.test(s)){hist=[];sv('hist',hist);chat=[];sv('chat',chat);return say('Conversa apagada, senhor.')}
  if(/^(bom dia|boa tarde|boa noite|resumo do dia|briefing)( jarvis)?$/.test(s))return resumo();
  if(/(quem e voce|quem voce e|se apresente)/.test(s))return say('Sou o J.A.R.V.I.S., Just A Rather Very Intelligent System, seu assistente pessoal, senhor.');
  if(m=raw.match(/(?:me )?(?:lembre|lembra|avise|avisa)(?:-me)?(?: de| para)? (.+?) em (\d+) ?(segundo|minuto|hora)/i)){
    const sec=+m[2]*{segundo:1,minuto:60,hora:3600}[m[3].toLowerCase()];addTimer(sec,m[1].trim(),true);play('ok');
    return say('Combinado, senhor. Avisarei sobre '+m[1].trim()+' em '+lbl(sec)+'.')}
  if(m=s.match(/(?:timer|temporizador|cronometro)(?: de| para)? (\d+) ?(segundo|minuto|hora)/)){

  if(t>.15&&t<.75){const al=1-(t-.15)/.6,g=bx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,255,255,'+al+')');g.addColorStop(.25,'rgba('+ACR+','+al*.6+')');g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(0,0,W,H)}
  [.2,.6,1.0,4.6].forEach(w=>{const u=(t-w)/1.5;if(u>0&&u<1){bx.strokeStyle='rgba('+col+','+(.85*(1-u))+')';bx.lineWidth=1+4*(1-u);bx.beginPath();bx.arc(CX,CY,u*Math.hypot(W,H)*.7,0,6.283);bx.stroke()}});
  if(t>.3&&t<3.4){const inten=Math.min(1,(t-.3)/.5)*Math.min(1,(3.4-t)/1.2),acc=t<2?1+t*1.6:Math.max(.25,4.2-(t-2)*2.8),far=Math.hypot(W,H)*.6;bx.lineWidth=1.3;
    for(const s of WS){s.d*=1+dt*s.v*acc*2.2;if(s.d>far){s.d=4+Math.random()*24;s.a=Math.random()*6.283}
      const len=Math.min(s.d*.28,140)*acc*.5,cs=Math.cos(s.a),sn=Math.sin(s.a);
      bx.strokeStyle='rgba(170,235,255,'+(inten*Math.min(.9,.1+s.d/260))+')';bx.beginPath();bx.moveTo(CX+cs*(s.d-len),CY+sn*(s.d-len));bx.lineTo(CX+cs*s.d,CY+sn*s.d);bx.stroke()}}
  bRot+=dt*(t<3.2?3.4:1.3);
  if(t>1.3){const a=Math.min(1,(t-1.3)/.9);drawSphere(bx,CX,CY,R*.3*(.55+.45*a),bRot,.35,a,0,col)}
  if(t>1.7){[.46,.58,.70,.82].forEach((r,k)=>{const pr=Math.min(1,(t-1.7-k*.22)/.9);if(pr<=0)return;const rt=t*(k%2?.5:-.4);
    bx.strokeStyle='rgba('+col+',.9)';bx.lineWidth=[1.5,5,1.5,2][k];bx.setLineDash(k===1?[40*pr,10]:k===3?[3,5]:[]);bx.beginPath();bx.arc(CX,CY,r*R,rt,rt+6.283*pr);bx.stroke();bx.setLineDash([])})}
  if(t>2.3){const al=Math.min(1,(t-2.3)/.8);bx.strokeStyle='rgba('+col+','+al*.8+')';bx.lineWidth=1.3;bx.beginPath();
    for(let i=0;i<96;i++){const a=i*Math.PI/48+t*.15,l=i%8?5:12,r0=R*.72;bx.moveTo(CX+Math.cos(a)*r0,CY+Math.sin(a)*r0);bx.lineTo(CX+Math.cos(a)*(r0+l),CY+Math.sin(a)*(r0+l))}bx.stroke()}
  if(t>2.7){const pr=Math.min(1,(t-2.7)/1.1),L=6*R*.965;bx.strokeStyle='rgba('+col+',.85)';bx.lineWidth=1.6;bx.setLineDash([pr*L,L]);hexPath(bx,CX,CY,R*.965,t*.12);bx.stroke();bx.setLineDash([])}
  if(t>1.9){const al=Math.min(1,(t-1.9)/.8)*(t>5?Math.max(0,1-(t-5)/.5):1);
    frame.n=(frame.n||0)+1;if(frame.n%5===0)RN.forEach(cl=>{cl[Math.random()*cl.length|0]='0x'+hexs(4)+' '+hexs(6)});
    bx.font='10px "Share Tech Mono",monospace';bx.textAlign='left';
    RN.forEach((lines,ci)=>lines.forEach((ln,i)=>{bx.fillStyle='rgba('+col+','+(al*(.1+.4*(1-i/lines.length)))+')';bx.fillText(ln,ci?W-92:10,H*.14+i*15)}))}
  if(t>2.4&&t<3.7){const y=CY-R-30+((t-2.4)/1.3)*(2*R+60),w=R*1.15,g=bx.createLinearGradient(CX-w,0,CX+w,0);g.addColorStop(0,'rgba('+col+',0)');g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(1,'rgba('+col+',0)');
    bx.fillStyle=g;bx.fillRect(CX-w,y-1.5,2*w,3);const g2=bx.createLinearGradient(0,y-70,0,y);g2.addColorStop(0,'rgba('+col+',0)');g2.addColorStop(1,'rgba('+col+',.25)');bx.fillStyle=g2;bx.fillRect(CX-w,y-70,2*w,70)}
  if(t>2.1){const pr=Math.min(1,(t-2.1)/1.3),n=Math.floor(pr*TITLE.length);let o='';for(let i=0;i<TITLE.length;i++)o+=(i<n||TITLE[i]==='.')?TITLE[i]:GL[Math.random()*GL.length|0];bt.textContent=pr>=1?TITLE:o;bt.style.opacity=Math.min(1,(t-2.1)*3)}
  if(t>2.7){bp2.style.opacity=t>4.4?0:1;bp2.firstChild.style.width=Math.min(100,(t-2.7)/1.7*100)+'%'}
  const LG=['NÚCLEO ........... OK','VOZ PT-BR ........ OK','REDE ............. '+(navigator.onLine?'OK':'OFF'),'IA ............... '+(sample?'OK':'OFF'),'INTERFACE ........ OK'];
  const cn=Math.max(0,Math.min(5,Math.floor((t-2.7)/.3)+1));if(cn!==lastN){lastN=cn;bl.textContent=LG.slice(0,cn).join('\n')}
  if(t>4.4)bl.style.opacity=0;
  if(t>4.5&&!bs.classList.contains('on')){bs.classList.add('on');bt.style.color='var(--ac2)';bt.style.textShadow='0 0 20px var(--ac2),0 0 50px var(--ac2)'}
  if(t>4.5&&!said){said=true;const h=new Date().getHours();speak((h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+', senhor. Todos os sistemas estão operacionais. Em que posso ajudá-lo?')}
  if(t>5.5&&!iris){iris=true;introT=performance.now();mainDraw=true;boot.style.clipPath='circle(0px at '+CX+'px '+CY+'px)';$('#sk').style.opacity=0}
  if(t>7){boot.remove();return}
  requestAnimationFrame(frame)}
boot.onclick=()=>{
  if(t0!==null){if(!iris){t0=performance.now()-5500;try{if(bootAud)bootAud.pause()}catch(e){}}return}
  bsize();mkBoot();ax();bootAud=play('boot')||null;
  bt.className='';bt.style.top=(CY+R0+22)+'px';bt.style.opacity=0;$('#sk').style.opacity=.7;t0=performance.now();bx.globalCompositeOperation='source-over';bx.fillStyle='#000';bx.fillRect(0,0,BW,BH)};

  const r=$('#reactor').getBoundingClientRect();RS=Math.max(60,Math.round(r.width));rc.width=RS*DPR;rc.height=RS*DPR;
  RCX=r.left+r.width/2;RCY=r.top+r.height/2;RR=r.width/2;mkStars();if(t0===null)bsize()}

addEventListener('pointerdown',()=>{try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}},{once:true});

rs();
requestAnimationFrame(frame);
requestAnimationFrame(loop);

})();
