<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000308">
<title>STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.42.0/src-min-noconflict/ace.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.42.0/src-min-noconflict/ext-language_tools.js"></script>
<style>
:root{color-scheme:dark;--ac:#1f86ff;--ac2:#8ccbff;--acr:31,134,255;--ac2r:140,203,255;--fg:#dff8ff;--mut:#6aa6c2;--hud:Orbitron,system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000308;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{height:100dvh;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#neb{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 35% at 50% 0,rgba(var(--acr),.24),transparent 70%),radial-gradient(50% 35% at 8% 100%,rgba(var(--ac2r),.1),transparent 70%),radial-gradient(50% 35% at 100% 70%,rgba(var(--acr),.12),transparent 70%),#000308}
#neb::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(var(--acr),.05) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(var(--acr),.05) 1px,transparent 1px) 0 0/28px 100%;mask:radial-gradient(ellipse at center,#000 25%,transparent 80%);-webkit-mask:radial-gradient(ellipse at center,#000 25%,transparent 80%)}
header,#tabs,#edw,#bt{position:relative;z-index:5}

/* topo */
header{display:flex;align-items:center;gap:2px;padding:4px 6px;flex:none;height:54px;border-bottom:1px solid rgba(var(--acr),.45);background:linear-gradient(rgba(var(--acr),.14),rgba(var(--acr),.03)),rgba(2,10,20,.85)}
.ic{border:0;background:none;color:var(--ac);width:42px;height:42px;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ic svg{width:24px;height:24px;filter:drop-shadow(0 0 4px rgba(var(--acr),.8))}
.ic:active,.ic.on{background:rgba(var(--acr),.35);color:var(--ac2)}
#ttl{flex:1;min-width:0;padding-left:6px}
#tn{display:block;font:900 13px var(--hud);letter-spacing:.14em;color:var(--ac);text-shadow:0 0 10px var(--ac);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sub{display:block;font:10px var(--mono);letter-spacing:.12em;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* abas */
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:none;height:38px;background:rgba(var(--acr),.07);border-bottom:1px solid rgba(var(--acr),.35)}
#tabs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:0 2px 0 12px;color:var(--mut);font:600 12px var(--mono);border-top:2px solid transparent;max-width:210px}
.tab svg{width:16px;height:16px;flex:none}
.tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.tab .dot{width:6px;height:6px;border-radius:50%;background:#ffd23f;box-shadow:0 0 6px #ffd23f;flex:none;display:none}
.tab.dirty .dot{display:block}
.tab button{border:0;background:none;color:inherit;padding:9px 9px;display:flex}
.tab.on{color:var(--fg);border-top-color:var(--ac);background:linear-gradient(rgba(var(--acr),.25),transparent);box-shadow:inset 0 2px 10px -4px var(--ac)}

/* editor */
#edw{flex:1;min-height:0;background:#020a14}
#ed{position:absolute;inset:0}
#ed.ace_editor{background:#020a14!important;font-family:"JetBrains Mono",monospace}
.ace_gutter{background:#03101c!important}
.ace_gutter-active-line,.ace_marker-layer .ace_active-line{background:rgba(var(--acr),.12)!important}
.ace_cursor{color:var(--ac2)!important}.ace_search{background:#06173a!important}
.ace_mobile-menu{display:none!important}
.ace_marker-layer .ace_selected-word{background:rgba(var(--acr),.35)!important;border:0!important}

/* hexágonos */
.hx{position:relative;display:block;text-decoration:none;width:44px;height:50px;border:0;padding:0;background:var(--ac);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);color:var(--ac);flex:none}
.hx::before{content:"";position:absolute;inset:1.5px;background:linear-gradient(#05182a,#020a12);clip-path:inherit}
.hx:active::before{background:rgba(var(--acr),.45)}
.hx span{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
.hx svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(var(--acr),.9))}
#fab{position:absolute;right:12px;bottom:12px;z-index:6}

/* barra de baixo */
#bt{flex:none;height:78px;background:linear-gradient(rgba(var(--acr),.12),rgba(var(--acr),.03)),#020a14;border-top:1px solid rgba(var(--acr),.6);box-shadow:0 -4px 18px rgba(var(--acr),.16)}
#qt{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:1fr 1fr;height:100%}
.q{border:0;background:none;color:var(--ac);display:flex;align-items:center;justify-content:center;font:700 10px var(--hud);letter-spacing:.04em;padding:0;position:relative;min-width:0}
.q svg{width:21px;height:21px;filter:drop-shadow(0 0 4px rgba(var(--acr),.8))}
.q:active{background:rgba(var(--acr),.4)}
.q.on{background:var(--ac);color:#001}
.q.off{opacity:.35}
.q .dt{position:absolute;top:3px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#ffd23f;box-shadow:0 0 6px #ffd23f;display:none}
.q.dirty .dt{display:block}
#bar{display:none;grid-template-columns:2fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr;height:100%}
#bar input{background:none;border:0;border-bottom:1px solid rgba(var(--acr),.7);outline:0;color:var(--fg);font:14px var(--mono);margin:0 10px;min-width:0;caret-color:var(--ac)}
#bar input::placeholder{color:var(--mut)}
#bn{display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 8px;font:11px var(--mono);color:var(--ac2);letter-spacing:.06em;min-width:0}
#bn .q{width:34px;height:100%;flex:none}
#sopt{position:absolute;right:8px;bottom:calc(100% + 8px);display:none;gap:6px}
.sb{border:0;color:var(--ac);background:rgba(var(--acr),.16);font:700 10px var(--hud);letter-spacing:.12em;padding:11px 15px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);white-space:nowrap;flex:none;text-decoration:none;display:inline-block}
.sb:active,.sb.on{background:var(--ac);color:#001}
.sb.g{color:var(--ac2);background:rgba(var(--ac2r),.16)}.sb.g:active{background:var(--ac2);color:#001}
.sb.d{color:#ff7d97;background:rgba(255,90,120,.14)}.sb.d:active{background:#ff5a78;color:#100}
#sopt .sb{background:#06173a}#sopt .sb.on{background:var(--ac)}

/* menu de segurar + alças */
#cm{position:fixed;z-index:45;display:none;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100vw - 16px);filter:drop-shadow(0 0 12px rgba(var(--acr),.5))}
#cm.on{display:flex}
.cr{background:var(--ac);padding:1px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.cr>div{display:flex;background:#020b14;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.cb{border:0;background:none;color:var(--ac);width:46px;height:44px;display:flex;align-items:center;justify-content:center;padding:0}
.cb svg{width:21px;height:21px;filter:drop-shadow(0 0 4px rgba(var(--acr),.8))}
.cb:active{background:rgba(var(--acr),.4)}
.cb.off{opacity:.3;pointer-events:none}
.cxr{display:none;flex-wrap:wrap;gap:6px}
#cm.more .cxr{display:flex}
.cxr .sb{background:#06173a}.cxr .sb:active{background:var(--ac)}
.hd{position:fixed;z-index:44;width:44px;height:44px;display:none;touch-action:none}
.hd::before{content:"";position:absolute;left:14px;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ac),0 0 10px var(--ac)}

/* painéis */
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;flex:none}
.in{width:100%;border:0;outline:0;background:rgba(var(--acr),.12);color:var(--fg);font:15px var(--mono);padding:13px 18px;caret-color:var(--ac);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#sh,#dr{position:fixed;inset:0;z-index:40;pointer-events:none}
#sh.open,#dr.open{pointer-events:auto}
#shd,#drd{position:absolute;inset:0;background:rgba(0,3,8,.6);opacity:0;transition:opacity .3s}
#sh.open #shd,#dr.open #drd{opacity:1}
#shp{position:absolute;left:0;right:0;bottom:0;height:80dvh;display:flex;flex-direction:column;padding:30px 20px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);clip-path:polygon(0 30px,30px 0,calc(50% - 70px) 0,calc(50% - 46px) 14px,calc(50% + 46px) 14px,calc(50% + 70px) 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%);background:linear-gradient(rgba(var(--acr),.9),rgba(var(--acr),.9)) top/100% 2px no-repeat,linear-gradient(rgba(var(--acr),.14),rgba(var(--acr),.03) 40%),#020b14}
#sh.open #shp{transform:none}
#drp{position:absolute;left:0;top:0;bottom:0;width:min(88vw,360px);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px;transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%);background:linear-gradient(rgba(var(--acr),.9),rgba(var(--acr),.9)) right/2px 100% no-repeat,linear-gradient(160deg,rgba(var(--acr),.16),rgba(var(--acr),.03) 40%),#020b14}
#dr.open #drp{transform:none}
#sht,#drt{text-align:center;font:700 12px var(--hud);letter-spacing:.4em;color:var(--ac);text-shadow:0 0 10px var(--ac);padding:2px 0 12px;flex:none}
#shx{position:absolute;right:24px;top:26px;width:24px;height:24px;transform:rotate(45deg);border:1.5px solid var(--ac);background:transparent;color:var(--ac);font:400 18px/1 sans-serif;padding:0}
#shb,#drb{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.it{position:relative;margin-bottom:10px;background:rgba(var(--acr),.5);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.it::before{content:"";position:absolute;inset:1px;background:linear-gradient(135deg,rgba(var(--acr),.16),rgba(var(--acr),.03) 45%),#020a14;clip-path:inherit}
.ib{position:relative;padding:12px 15px}
.tp b{display:block;font:700 12px var(--hud);letter-spacing:.12em;color:var(--ac);text-shadow:0 0 8px rgba(var(--acr),.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp i{font:normal 10px var(--mono);color:var(--ac2);letter-spacing:.1em}
.ib pre{margin:6px 0 0;font:12px/1.4 var(--mono);color:#cfe6ff;white-space:pre-wrap;word-break:break-all;max-height:36px;overflow:hidden}
.mt{font:9px var(--mono);letter-spacing:.14em;color:var(--mut);margin:6px 0 10px}
.ac{display:flex;gap:7px;flex-wrap:wrap}
.cmd{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(var(--acr),.25);background:none;color:var(--fg);font:14px var(--mono);padding:14px 6px}
.cmd:active{background:rgba(var(--acr),.3)}
.em{color:var(--mut);font:12px/1.8 var(--mono);letter-spacing:.12em;text-align:center;margin:30px 10px;text-transform:uppercase}
#pv{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#000308;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#pv.on{display:flex}
#pv .row{align-items:center;justify-content:space-between;padding:8px 12px}
#pvn{font:11px var(--mono);color:var(--mut)}
#pv iframe{flex:1;border:0;background:#fff;min-height:0}
#ts{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ac);color:#001;padding:10px 24px;font:700 11px var(--hud);letter-spacing:.16em;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);opacity:0;transition:.2s;pointer-events:none;z-index:70;white-space:nowrap}
#ts.on{opacity:1}
.jscan{position:fixed;left:0;right:0;top:0;height:2px;z-index:70;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(var(--acr),.95),transparent);box-shadow:0 0 18px 4px rgba(var(--acr),.55);animation:jsc 1.2s .1s ease-in both}
@keyframes jsc{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(100dvh);opacity:0}}
</style>
</head>
<body>
<div id="neb"></div>
<div class="jscan"></div>
<header>
  <button class="ic" id="hm"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div id="ttl"><b id="tn"></b><small id="sub"></small></div>
  <button class="ic" id="pen"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
  <button class="ic" id="mn"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg></button>
</header>
<div id="tabs"></div>
<div id="edw"><div id="ed"></div><button class="hx" id="fab"></button></div>
<div id="bt">
  <div id="qt"></div>
  <div id="bar">
    <input id="bq" placeholder="Pesquisar" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="q" id="bprev"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="q" id="bnext"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="q" id="bgear"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
    <input id="bp" placeholder="Substituir" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="q" id="brep"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="10" height="7"/><path d="M8 14v5h12v-8h-3"/><path d="M15 9l2 2-2 2"/></svg></button>
    <button class="q" id="brall"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6"/><rect x="3" y="13" width="7" height="6"/><rect x="13" y="3" width="8" height="16"/></svg></button>
    <div id="bn"><span id="bnn">0 de 0</span><button class="q" id="bx"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <div id="sopt"><button class="sb" data-o="cs">Aa</button><button class="sb" data-o="w">PALAVRA</button><button class="sb" data-o="re">.*</button></div>
</div>
<div id="pv"><div class="row"><button class="sb d" id="pvx">FECHAR</button><span id="pvn"></span></div><iframe id="fr2" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
<div id="dr"><div id="drd"></div><div id="drp"><div id="drt">ARQUIVOS</div><div id="drb"></div></div></div>
<div id="sh"><div id="shd"></div><div id="shp"><div id="sht"></div><button id="shx">+</button><div id="shb"></div></div></div>
<div id="ts"></div>
<input type="file" id="fi" multiple hidden>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem('js_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('js_'+k,JSON.stringify(v))}catch(e){}};
const ldj=(k,d)=>{try{const v=localStorage.getItem('jp_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ext=n=>((n.split('.').pop())||'').toLowerCase();
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const svg=p=>'<svg viewBox="0 0 24 24">'+p+'</svg>';
const SAMPLE='<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body{background:#030a1c;color:#00f0ff;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0}\n  </style>\n</head>\n<body>\n  <h1>Olá, senhor.</h1>\n</body>\n</html>\n';

/* nada de menu nativo ao segurar (só nos campos de texto comuns) */
document.addEventListener('contextmenu',e=>{if(!e.target.closest('.in,#bq,#bp'))e.preventDefault()});

/* ===== TEMA (o mesmo do JARVIS / COFRE) ===== */
const TH={azul:['#1f86ff','#8ccbff'],vermelho:['#ff3b3b','#ffb04a'],dourado:['#ffc233','#fff0a0'],roxo:['#b46bff','#ff8ae2'],verde:['#2cff8a','#d9ff7a']};
const h2r=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(',');
(()=>{const n=TH[ldj('th','azul')]?ldj('th','azul'):'azul',p=TH[n],r=document.documentElement.style;
 r.setProperty('--ac',p[0]);r.setProperty('--ac2',p[1]);r.setProperty('--acr',h2r(p[0]));r.setProperty('--ac2r',h2r(p[1]))})();

/* ===== SONS (os mesmos do JARVIS) ===== */
const fxOn=ldj('fx',true),vol=ldj('vol',.8),SU={};let AX=null;
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('jarvis_sons',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
const idbGet=async k=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}};
async function loadSounds(){for(const k of ['click','ok','err','open']){const b=await idbGet(k);if(b){SU[k]=URL.createObjectURL(b);continue}try{const r=await fetch('sons/'+k+'.mp3',{method:'HEAD'});if(r.ok)SU[k]='sons/'+k+'.mp3'}catch(e){}}}
function ax(){if(!AX){try{AX=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AX.state==='suspended')AX.resume();return AX}
function bp(f1,f2,d,v,type){const x=ax();if(!x)return;const t=x.currentTime,o=x.createOscillator(),g=x.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*vol),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(x.destination);o.start(t);o.stop(t+d+.05)}
const FB={click:()=>bp(2200,3200,.05,.05),ok:()=>{bp(900,0,.12,.07);setTimeout(()=>bp(1350,0,.18,.07),110)},err:()=>bp(300,120,.3,.1,'sawtooth'),open:()=>bp(400,1200,.15,.05)};
function play(k){if(!fxOn)return;const u=SU[k];if(u){try{const a=new Audio(u);a.volume=Math.min(1,vol);a.play().catch(()=>{});return}catch(e){}}try{FB[k]&&FB[k]()}catch(e){}}

function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{play('ok');toast('COPIADO')}).catch(()=>{play('err');toast('NÃO FOI POSSÍVEL COPIAR')})}
function dl(n,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('BAIXANDO '+n.toUpperCase())}

/* ===== ARMAZENAMENTO (IndexedDB: um arquivo por vez, sem limite de 5MB) ===== */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('jarvis_studio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('f');r.result.createObjectStore('m')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(s,mode,fn)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,mode),r=fn(t.objectStore(s));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})};
const dbGet=(s,k)=>tx(s,'readonly',st=>st.get(k));
const dbPut=(s,k,v)=>tx(s,'readwrite',st=>st.put(v,k));
const dbDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));

async function sess(id){
  if(SS[id])return SS[id];
  const m=meta(id),c=(await dbGet('f',id))||'';
  const s=ace.createEditSession(c,'ace/mode/'+(c.length>HUGE?'text':(MODES[ext(m.n)]||'text')));
  s.setUseWorker(false);s.setTabSize(2);s.setUseSoftTabs(true);
  s.on('change',()=>{if(!D.has(id)){D.add(id);dots()}saveSoon()});
  SS[id]=s;return s}

/* modo turbo: arquivo grande desliga o que pesa */
function tune(){const m=meta(cur),n=m?m.len:0,P=n>BIG||ed.session.getLength()>8000;PERF=P;
  if(P&&ed.session.getUseWrapMode())ed.session.setUseWrapMode(false);
  ed.setOptions({enableLiveAutocompletion:!P,enableBasicAutocompletion:!P,enableSnippets:!P,highlightActiveLine:!P,highlightSelectedWord:!P,behavioursEnabled:!P,displayIndentGuides:!P});stat()}

/* salvar: só o arquivo alterado, em segundo plano */
function dots(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('dirty',D.has(t.dataset.id)));$('[data-k=save]').classList.toggle('dirty',D.size>0)}
function saveSoon(){clearTimeout(tmr);tmr=setTimeout(flush,PERF?2500:700)}
let chain=Promise.resolve();
const flush=()=>chain=chain.then(doFlush);
async function doFlush(){const ids=[...D];D.clear();
  try{for(const id of ids){const s=SS[id],m=meta(id);if(!s||!m)continue;const c=s.getValue();m.len=c.length;await dbPut('f',id,c)}
    if(ids.length)await dbPut('m','list',list)}catch(e){toast('ERRO AO SALVAR')}
  dots()}

/* ===== COLAR INSTANTÂNEO (texto entra de uma vez, sem pedaços nem avisos) ===== */
function fastInsert(text){
  const s=ed.session,id=cur,mid=s.$modeId,mt=meta(id),tot=(mt?mt.len:0)+text.length,heavy=text.length>100000;
  if(!ed.selection.isEmpty())s.remove(ed.getSelectionRange());
  if(heavy){if(s.getUseWrapMode())s.setUseWrapMode(false);s.setMode('ace/mode/text')}
  const end=s.insert(ed.getCursorPosition(),text);
  if(mt)mt.len=tot;
  if(heavy)s.setMode(tot>HUGE?'ace/mode/text':mid);
  ed.selection.moveToPosition(end);ed.clearSelection();ed.renderer.scrollCursorIntoView(end,.5);
  tune();play('ok');toast('COLADO')}
const fastOk=t=>typeof t==='string'&&t.length>SMALL&&!ed.getReadOnly()&&!ed.inMultiSelectMode;
const _op=ed.onPaste.bind(ed),_ot=ed.onTextInput.bind(ed);
ed.onPaste=(t,ev)=>fastOk(t)?fastInsert(t):_op(t,ev);
ed.onTextInput=(t,c)=>(!c&&fastOk(t))?fastInsert(t):_ot(t,c);
function pasteText(t){if(!t||ed.getReadOnly())return;t.length>SMALL?fastInsert(t):ed.insert(t)}
const pasteClip=()=>navigator.clipboard.readText().then(pasteText).catch(()=>toast('COLAGEM BLOQUEADA'));

  try{let fn;const o={indent_size:2,wrap_line_length:0};
    if(['js','mjs','json','jsx','ts','tsx'].includes(x)){if(!window.js_beautify)await LS(B+'beautify.min.js');fn=js_beautify}

    const out=fn(sel||ed.getValue(),o);

    play('ok');toast('FORMATADO')}catch(e){play('err');toast('FALHOU (SEM INTERNET?)')}}

const MOD={ctrl:0,shft:0};
function setMod(k,v){MOD[k]=v;$('[data-k='+k+']').classList.toggle('on',!!v)}
function arrow(k){const sh=MOD.shft,ct=MOD.ctrl,S=ed.selection;
  if(k==='l')ct?(sh?S.selectWordLeft():ed.navigateWordLeft()):(sh?S.selectLeft():ed.navigateLeft(1));
  else if(k==='r')ct?(sh?S.selectWordRight():ed.navigateWordRight()):(sh?S.selectRight():ed.navigateRight(1));
  else if(k==='u')sh?S.selectUp():ed.navigateUp(1);
  else sh?S.selectDown():ed.navigateDown(1)}
function escape2(){
  if(sh.classList.contains('open'))closeSheet();
  else if(dr.classList.contains('open'))closeDrawer();
  else if(sOpen())hideSearch();
  else{ed.clearSelection();try{ed.exitMultiSelectMode()}catch(e){}ed.blur()}
  hideMenu();setMod('ctrl',0);setMod('shft',0)}
function act(k){switch(k){
  case'ctrl':case'shft':setMod(k,!MOD[k]);break;
  case'tab':ed.execCommand('indent');break;
  case'undo':ed.undo();break;case'redo':ed.redo();break;
  case'find':sOpen()?hideSearch():showSearch();break;
  case'save':flush().then(()=>{play('ok');toast('SALVO')});break;
  case'esc':escape2();break;
  case'l':case'r':case'u':case'd':arrow(k);break;
  case'mu':ed.moveLinesUp();break;case'md':ed.moveLinesDown();break;
  case'cu':ed.copyLinesUp();break;case'cd':ed.copyLinesDown();break}}
const REP=new Set(['l','r','u','d','mu','md','cu','cd']);let rt,ri;
const stopRep=()=>{clearTimeout(rt);clearInterval(ri)};
$('#qt').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();const k=b.dataset.k;
  stopRep();act(k);if(REP.has(k))rt=setTimeout(()=>{ri=setInterval(()=>act(k),55)},380)});
addEventListener('pointerup',stopRep);addEventListener('pointercancel',stopRep);

/* CTRL / SHFT "de um toque" para o teclado do celular */
const CK={a:()=>ed.selectAll(),c:()=>copy(ed.getSelectedText()||ed.getValue()),x:()=>{const t=ed.getSelectedText();if(t){copy(t);ed.session.remove(ed.getSelectionRange())}},v:pasteClip,z:()=>ed.undo(),y:()=>ed.redo(),f:()=>showSearch(),h:()=>showSearch(1),d:()=>ed.selectMore(1),s:()=>act('save'),'/':()=>ed.toggleCommentLines(),l:()=>ed.execCommand('gotoline')};
const MH={handleKeyboard(d,h,ks){
  if(h!==-1||(!MOD.ctrl&&!MOD.shft))return;
  if(MOD.ctrl){const f=CK[String(ks).toLowerCase()];setMod('ctrl',0);return{command:{name:'ctl',exec:()=>{f&&f()}}}}
  setMod('shft',0);return{command:{name:'shf',exec:()=>{ed.insert(String(ks).toUpperCase())}}}}};
const addMH=()=>{ed.keyBinding.removeKeyboardHandler(MH);ed.keyBinding.addKeyboardHandler(MH)};
addMH();try{ed.setKeyboardHandler('ace/keyboard/vscode',addMH)}catch(e){}
ed.commands.addCommand({name:'salvar',bindKey:{win:'Ctrl-S',mac:'Command-S'},exec:()=>act('save')});

/* ===== MENU DE SEGURAR + ALÇAS (substituem o menu padrão) ===== */
const Range=ace.require('ace/range').Range;
const CMB=[
 ['cp',svg('<rect x="9" y="9" width="11" height="11"/><path d="M5 15V5h10"/>')],
 ['ct',svg('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 8l12 10M8 16L20 6"/>')],
 ['ps',svg('<rect x="6" y="5" width="12" height="16"/><path d="M9 5V3h6v2"/>')],
 ['sa',svg('<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><rect x="9" y="9" width="6" height="6"/>')],
 ['mo',svg('<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>')]
];
const CMX=[['cmt','COMENTAR'],['dup','DUPLICAR'],['del','APAGAR LINHA'],['fnd','BUSCAR'],['cof','COFRE'],['up','MAIÚSC'],['low','minúsc']];
const mn=document.createElement('div');mn.id='cm';
mn.innerHTML='<div class="cr"><div>'+CMB.map(b=>'<button class="cb" data-c="'+b[0]+'">'+b[1]+'</button>').join('')+'</div></div><div class="cxr">'+CMX.map(b=>'<button class="sb" data-c="'+b[0]+'">'+b[1]+'</button>').join('')+'</div>';
const H=[document.createElement('div'),document.createElement('div')];H.forEach(h=>{h.className='hd'});
document.body.append(mn,H[0],H[1]);
let menuOn=false,hraf=0,drag=null;
const hasSel=()=>!ed.selection.isEmpty();
function showMenu(){menuOn=true;mn.classList.add('on');mn.classList.remove('more');placeUI()}
function hideMenu(){menuOn=false;mn.classList.remove('on','more')}
function schedUI(){if((menuOn||hasSel()||H[0].style.display==='block')&&!hraf)hraf=requestAnimationFrame(placeUI)}
function placeUI(){hraf=0;
  const r=ed.getSelectionRange(),box=$('#ed').getBoundingClientRect(),lh=ed.renderer.lineHeight,empty=r.isEmpty();
  const pt=p=>{const c=ed.renderer.textToScreenCoordinates(p.row,p.column);return{x:c.pageX,y:c.pageY}};
  const a=pt(r.start),b=pt(r.end);
  [[H[0],a],[H[1],b]].forEach(([h,c])=>{
    const vis=!empty&&c.y>=box.top-2&&c.y+lh<=box.bottom+2&&c.x>=box.left-2&&c.x<=box.right+2;
    h.style.display=vis?'block':'none';h.style.left=(c.x-22)+'px';h.style.top=(c.y+lh-4)+'px'});
  if(!menuOn)return;
  mn.querySelector('[data-c=cp]').classList.toggle('off',empty);mn.querySelector('[data-c=ct]').classList.toggle('off',empty);
  const w=mn.offsetWidth,h=mn.offsetHeight;
  let x=a.x-w/2+(empty?0:(b.y===a.y?(b.x-a.x)/2:0)),y=a.y-h-12;
  if(y<box.top+4)y=b.y+lh+34;
  x=Math.max(8,Math.min(innerWidth-w-8,x));y=Math.max(box.top+2,Math.min(innerHeight-h-8,y));
  mn.style.left=x+'px';mn.style.top=y+'px'}
ed.on('changeSelection',schedUI);
ed.on('afterRender',schedUI);
ed.on('change',()=>{if(menuOn)hideMenu()});
mn.addEventListener('pointerdown',e=>e.preventDefault());
const CM={
 cp:()=>{const t=ed.getSelectedText();if(t)copy(t);hideMenu()},
 ct:()=>{const t=ed.getSelectedText();if(t){copy(t);ed.session.remove(ed.getSelectionRange())}hideMenu()},
 ps:()=>{hideMenu();pasteClip()},
 sa:()=>{ed.selectAll();showMenu()},
 mo:()=>{mn.classList.toggle('more');placeUI()},
 cmt:()=>{ed.toggleCommentLines();hideMenu()},dup:()=>{ed.execCommand('copylinesdown');hideMenu()},del:()=>{ed.removeLines();hideMenu()},
 fnd:()=>{hideMenu();showSearch()},cof:()=>{toCofre();hideMenu()},up:()=>{ed.toUpperCase();hideMenu()},low:()=>{ed.toLowerCase();hideMenu()}};
mn.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;play('click');CM[b.dataset.c]()};
/* alças arrastáveis */
H.forEach((h,i)=>{
  h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{h.setPointerCapture(e.pointerId)}catch(x){}
    const r=ed.getSelectionRange();drag={i,fix:i?{row:r.start.row,column:r.start.column}:{row:r.end.row,column:r.end.column}};hideMenu()});
  h.addEventListener('pointermove',e=>{if(!drag||drag.i!==i)return;
    const lh=ed.renderer.lineHeight,p=ed.renderer.screenToTextCoordinates(e.clientX,e.clientY-lh*.5-22),f=drag.fix,
      back=p.row<f.row||(p.row===f.row&&p.column<f.column);
    ed.selection.setSelectionRange(back?new Range(p.row,p.column,f.row,f.column):new Range(f.row,f.column,p.row,p.column),back);
    ed.renderer.scrollCursorIntoView(p)});
  const end=()=>{if(drag&&drag.i===i){drag=null;showMenu()}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)});
/* segurar no código → abre o menu */
let lp,lx=0,ly=0;const EC=$('#ed');
EC.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;lx=e.clientX;ly=e.clientY;clearTimeout(lp);hideMenu();lp=setTimeout(showMenu,560)},{passive:true});
EC.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lx,e.clientY-ly)>10)clearTimeout(lp)},{passive:true});
['pointerup','pointercancel'].forEach(t=>EC.addEventListener(t,()=>clearTimeout(lp),{passive:true}));

/* ===== BUSCA / SUBSTITUIÇÃO ===== */
const SO={cs:0,w:0,re:0};let cnt=[],ct,st2;
const sOpen=()=>$('#bar').style.display==='grid';
const sopts=()=>({needle:$('#bq').value,caseSensitive:!!SO.cs,wholeWord:!!SO.w,regExp:!!SO.re});
function upd(){const r=ed.getSelectionRange();const i=cnt.findIndex(x=>x.start.row===r.start.row&&x.start.column===r.start.column);$('#bnn').textContent=(i+1)+' de '+cnt.length}
function recount(){clearTimeout(ct);ct=setTimeout(()=>{const o=sopts();if(!o.needle){cnt=[];upd();return}
  try{const S=new(ace.require('ace/search').Search)();S.set(o);cnt=S.findAll(ed.session).slice(0,100000)}catch(e){cnt=[]}upd()},PERF?500:200)}
function sfind(back,first){const o=sopts();if(!o.needle){upd();return}
  try{ed.find(o.needle,{backwards:!!back,wrap:true,caseSensitive:o.caseSensitive,wholeWord:o.wholeWord,regExp:o.regExp,skipCurrent:!first},false)}catch(e){}
  try{ed.session.highlight(ed.$search.$options.re)}catch(e){}
  upd()}
function showSearch(rep){hideMenu();$('#qt').style.display='none';$('#bar').style.display='grid';fabSet();
  const t=ed.getSelectedText();if(t&&!t.includes('\n')&&t.length<200)$('#bq').value=t;
  recount();setTimeout(()=>(rep?$('#bp'):$('#bq')).focus(),30)}
function hideSearch(){$('#bar').style.display='none';$('#qt').style.display='grid';$('#sopt').style.display='none';try{ed.session.highlight(null)}catch(e){}fabSet()}
$('#bq').oninput=()=>{clearTimeout(st2);st2=setTimeout(()=>{sfind(false,true);recount()},PERF?500:150)};
$('#bq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sfind(e.shiftKey)}};
$('#bp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#brep').click()}};
const keep=el=>el.addEventListener('pointerdown',e=>e.preventDefault());
['#bprev','#bnext','#bgear','#brep','#brall','#bx'].forEach(s=>keep($(s)));
$('#bprev').onclick=()=>{play('click');sfind(true)};
$('#bnext').onclick=()=>{play('click');sfind(false)};
$('#bx').onclick=()=>{play('click');hideSearch()};
$('#bgear').onclick=()=>{play('click');const o=$('#sopt');o.style.display=o.style.display==='flex'?'none':'flex'};
$('#sopt').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const k=b.dataset.o;SO[k]=SO[k]?0:1;b.classList.toggle('on',!!SO[k]);recount();sfind(false,true)};
$('#brep').onclick=()=>{play('click');const o=sopts();if(!o.needle)return;ed.$search.set(o);
  const r=ed.getSelectionRange(),t=ed.session.getTextRange(r);
  if(t){const out=ed.$search.replace(t,$('#bp').value);if(out!=null)ed.session.replace(r,out)}
  sfind(false);recount()};
$('#brall').onclick=()=>{play('click');const o=sopts();if(!o.needle)return;ed.$search.set(o);
  const n=ed.replaceAll($('#bp').value);toast(n+' SUBSTITUIÇÕES');recount()};

/* ===== BOTÃO FLUTUANTE (some enquanto a busca está aberta) ===== */
const FAB={dn:svg('<path d="M6 9l6 6 6-6"/>'),up:svg('<path d="M6 15l6-6 6 6"/>')};
let atEnd=false,fp=0;
function fabSet(){const f=$('#fab');f.style.display=sOpen()?'none':'';f.innerHTML='<span>'+(atEnd?FAB.up:FAB.dn)+'</span>'}
function fabSoon(){if(fp)return;fp=requestAnimationFrame(()=>{fp=0;const a=ed.getLastVisibleRow()>=ed.session.getLength()-2;if(a!==atEnd){atEnd=a;fabSet()}})}
ed.renderer.scrollBarV.on('scroll',fabSoon);
$('#fab').onclick=()=>{play('click');if(atEnd)ed.navigateFileStart();else ed.navigateFileEnd()};
fabSet();

/* ===== INICIAR ===== */
(async function boot(){
  try{list=await dbGet('m','list');
    if(!list){const old=ld('files',null);list=[];
      if(old&&old.length){for(const f of old){await dbPut('f',f.id,f.c);list.push({id:f.id,n:f.n,len:f.c.length})}}
      else{const id=uid();await dbPut('f',id,SAMPLE);list=[{id,n:'bem-vindo.html',len:SAMPLE.length}]}
      await dbPut('m','list',list)}
    const ui=ld('ui',null)||{cur:ld('cur',null)};
    open=(ui.open||[]).filter(meta);if(!open.length)open=[meta(ui.cur)?ui.cur:list[0].id];
    await activate(open.includes(ui.cur)?ui.cur:open[0]);
    loadSounds();setTimeout(()=>{const s=document.querySelector('.jscan');if(s)s.remove()},2000)
  }catch(e){toast('ERRO AO ABRIR O ARMAZENAMENTO')}
})();
</script>
