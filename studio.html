<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#010510">
<title>JARVIS · STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.42.0/src-min-noconflict/ace.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.42.0/src-min-noconflict/ext-language_tools.js"></script>
<style>
:root{color-scheme:dark;--b0:#010510;--b1:#00f0ff;--b2:#2fd8ff;--b3:#3d9bff;--b4:#2459e8;--b5:#12307f;--fg:#dff6ff;--mut:#6f9fd0;--ok:#7dffd0;--bad:#ff6b8a;--cp:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);--mono:"JetBrains Mono",ui-monospace,monospace;--hud:Orbitron,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b0)}
body{height:100dvh;display:flex;flex-direction:column;color:var(--fg);font:14px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font-family:inherit;cursor:pointer}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(70% 45% at 50% -5%,rgba(0,240,255,.26),transparent 70%),radial-gradient(60% 40% at 0 100%,rgba(36,89,232,.4),transparent 70%),radial-gradient(50% 40% at 100% 60%,rgba(61,155,255,.2),transparent 70%),var(--b0)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(47,216,255,.06) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(47,216,255,.06) 1px,transparent 1px) 0 0/28px 100%;animation:dr 14s linear infinite;mask:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
@keyframes dr{to{background-position:0 28px,28px 0}}
body>*:not(#bg):not(#ts):not(#pv){position:relative;z-index:2}
.cp{position:relative;clip-path:var(--cp);background:linear-gradient(135deg,var(--b1),var(--b4) 60%,var(--b5))}
.cp::before{content:"";position:absolute;inset:1px;clip-path:var(--cp);background:linear-gradient(160deg,rgba(10,29,77,.92),rgba(3,10,28,.96));z-index:0}
.cp>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
header a{color:var(--b1);text-decoration:none;font:700 12px var(--hud);padding:8px 14px;background:rgba(0,240,255,.12);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.lg{flex:1;font:900 11px var(--hud);letter-spacing:.3em;color:var(--b1);text-shadow:0 0 12px var(--b1)}
#sv{font:11px var(--mono);color:var(--ok)}
.v{display:none;flex:1;min-height:0;flex-direction:column;margin:0 10px 6px}
.v.on{display:flex}
.b{border:0;color:var(--b2);background:linear-gradient(180deg,rgba(61,155,255,.28),rgba(36,89,232,.14));font:600 12px var(--mono);padding:9px 12px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);min-height:38px;white-space:nowrap}
.b:active{background:var(--b3);color:#001}
.b.g{color:var(--ok)}.b.d{color:var(--bad)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;flex:none}
input[type=text],input[type=password]{width:100%;border:0;outline:0;background:rgba(36,89,232,.16);color:var(--fg);font:15px var(--mono);padding:11px 14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);caret-color:var(--b1)}
#fn{flex:1;min-width:0}
#edw{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px}
#ed{flex:1;min-height:0;position:relative}
#ed.ace_editor{background:#030a1c;font-family:var(--mono)}
.ace_gutter{background:#040d24!important}.ace_gutter-active-line,.ace_marker-layer .ace_active-line{background:rgba(47,216,255,.08)!important}
.ace_cursor{color:#00f0ff!important}.ace_search{background:#06173a!important}
#sb{font:10px var(--mono);color:var(--mut);display:flex;justify-content:space-between;padding:4px 8px;flex:none}
#sym{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:6px 0 2px;flex:none}
#sym .b{min-width:42px;padding:9px 8px;font-size:15px}
body.kb nav{display:none}
nav{display:flex;gap:8px;padding:6px 10px 8px;flex:none}
nav .b{flex:1;font:700 11px var(--hud);letter-spacing:.14em;padding:13px 4px}
nav .b.on{background:var(--b3);color:#001;box-shadow:0 0 18px var(--b2)}
.ls{flex:1;overflow-y:auto;min-height:0;padding:4px}
.it{display:flex;align-items:center;gap:8px;padding:12px;margin-bottom:8px}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font:600 14px var(--mono);color:var(--b2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t small{color:var(--mut);font:11px var(--mono)}
.cl{display:block;padding:12px;margin-bottom:10px}
.cl h4{margin:0 0 6px;font:600 13px var(--mono);color:var(--b2)}
.cl pre{margin:0 0 10px;font:12px/1.45 var(--mono);color:#cfe9ff;white-space:pre-wrap;word-break:break-all;max-height:96px;overflow:hidden}
.cl .row{padding:0}
.em{color:var(--mut);text-align:center;padding:30px 10px;font:13px/1.5 var(--mono)}
.lk{margin:auto;width:min(100%,340px);padding:30px 22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lk svg{width:64px;height:64px;margin:0 auto;color:var(--b1);filter:drop-shadow(0 0 10px var(--b1))}
.lk h2{margin:0;font:900 14px var(--hud);letter-spacing:.3em;color:var(--b1)}
.lk p{margin:0;color:var(--mut);font:12px/1.5 var(--mono)}
.lk.sh{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;padding:11px 22px;background:var(--b3);color:#001;font:700 12px var(--mono);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.25s;pointer-events:none}
#ts.on{opacity:1;transform:translateX(-50%)}
#pv{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--b0);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#pv.on{display:flex}
#pv .row{padding:8px 10px;justify-content:space-between;align-items:center}
#pv iframe{flex:1;border:0;background:#fff;min-height:0}
</style>
</head>
<body>
<div id="bg"></div>
<header><a href="index.html">‹ JARVIS</a><div class="lg">STUDIO</div><span id="sv"></span></header>

<section class="v on" id="v-ed">
  <div class="row"><input type="text" id="fn" placeholder="nome-do-arquivo.html" autocomplete="off" autocapitalize="off"><button class="b g" id="run">RODAR</button></div>
  <div class="row" id="tl">
    <button class="b" data-t="undo">DESFAZER</button><button class="b" data-t="redo">REFAZER</button>
    <button class="b" data-t="find">BUSCAR</button><button class="b" data-t="goto">IR PARA</button>
    <button class="b" data-t="sel">SEL +</button><button class="b" data-t="cmt">COMENTAR</button>
    <button class="b" data-t="fold">DOBRAR</button><button class="b" data-t="wrap">QUEBRA</button>
    <button class="b" data-t="a-">A−</button><button class="b" data-t="a+">A+</button>
    <button class="b" data-t="copy">COPIAR</button><button class="b g" data-t="vault">→ COFRE</button><button class="b" data-t="dl">BAIXAR</button>
  </div>
  <div id="edw" class="cp"><div id="ed"></div><div id="sb"><span id="pos">1:1</span><span id="lang"></span></div></div>
  <div id="sym"></div>
</section>

<section class="v" id="v-fl">
  <div class="row"><button class="b g" id="nw">+ NOVO</button><button class="b" id="im">IMPORTAR</button><button class="b" id="dall">BAIXAR TUDO</button></div>
  <div class="ls" id="fls"></div>
</section>

<section class="v" id="v-cf"><div class="ls" id="cfb" style="display:flex;flex-direction:column"></div></section>

<nav><button class="b on" data-v="ed">EDITOR</button><button class="b" data-v="fl">ARQUIVOS</button><button class="b" data-v="cf">COFRE</button></nav>

<div id="pv"><div class="row"><button class="b d" id="pvx">FECHAR</button><span id="pvn" style="font:11px var(--mono);color:var(--mut)"></span></div><iframe id="fr2" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
<div id="ts"></div>
<input type="file" id="fi" multiple hidden>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('js_'+k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('js_'+k,JSON.stringify(v))}catch(e){toast('Armazenamento cheio')}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SAMPLE='<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body{background:#030a1c;color:#00f0ff;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0}\n  </style>\n</head>\n<body>\n  <h1>Olá, senhor.</h1>\n</body>\n</html>\n';
let files=ld('files',null)||[{id:uid(),n:'bem-vindo.html',c:SAMPLE}],cur=ld('cur',null),tmr;
if(!files.find(f=>f.id===cur))cur=files[0].id;
const F=()=>files.find(f=>f.id===cur),ext=n=>((n.split('.').pop())||'').toLowerCase();
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado')).catch(()=>toast('Não foi possível copiar'))}
function dl(n,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('Baixando '+n)}

/* ===== EDITOR (Ace: só desenha as linhas visíveis, aguenta arquivo grande) ===== */
ace.config.set('basePath','https://cdn.jsdelivr.net/npm/ace-builds@1.42.0/src-min-noconflict/');
const MODES={js:'javascript',mjs:'javascript',html:'html',htm:'html',css:'css',json:'json',md:'markdown',py:'python',ts:'typescript',xml:'xml',sh:'sh',yml:'yaml',yaml:'yaml',php:'php',java:'java',c:'c_cpp',cpp:'c_cpp',sql:'sql',txt:'text'};
const SS={},D=new Set();
const val=f=>SS[f.id]?SS[f.id].getValue():f.c;
function sess(f){if(!SS[f.id]){const s=ace.createEditSession(f.c,'ace/mode/'+(MODES[ext(f.n)]||'text'));s.setUseWorker(false);s.setTabSize(2);s.setUseSoftTabs(true);s.on('change',()=>{D.add(f.id);saveSoon()});SS[f.id]=s}return SS[f.id]}
const ed=ace.edit('ed',{theme:'ace/theme/tomorrow_night_blue',fontSize:14,showPrintMargin:false,enableBasicAutocompletion:true,enableLiveAutocompletion:true,enableSnippets:true,highlightActiveLine:true,scrollPastEnd:.3,fixedWidthGutter:true,fontFamily:'JetBrains Mono,monospace'});
ed.setSession(sess(F()));
new ResizeObserver(()=>ed.resize()).observe($('#ed'));
function stat(){const p=ed.getCursorPosition();$('#pos').textContent=(p.row+1)+':'+(p.column+1);$('#lang').textContent=(ext(F().n)||'txt').toUpperCase()+' · '+ed.session.getLength()+' linhas'}
ed.selection.on('changeCursor',stat);ed.on('change',stat);
ed.on('focus',()=>document.body.classList.add('kb'));ed.on('blur',()=>document.body.classList.remove('kb'));
function saveSoon(){$('#sv').textContent='…';clearTimeout(tmr);tmr=setTimeout(()=>{files.forEach(f=>{if(D.has(f.id)&&SS[f.id])f.c=SS[f.id].getValue()});D.clear();sv('files',files.map(({id,n,c})=>({id,n,c})));sv('cur',cur);$('#sv').textContent='SALVO'},700)}
$('#fn').value=F().n;
$('#fn').onchange=()=>{const v=$('#fn').value.trim();if(!v)return;F().n=v;SS[F().id]&&SS[F().id].setMode('ace/mode/'+(MODES[ext(v)]||'text'));saveSoon();stat()};

/* barra de símbolos (não fecha o teclado) */
const SY=[['TAB','T'],['{ }','{'],['( )','('],['[ ]','['],['< >','<>'],['" "','"'],["' '","'"],['` `','``'],[';',';'],[':',':'],['=','='],['=>','=>'],['/','/'],['.','.'],[',',','],['#','#'],['$','$'],['!','!'],['&','&'],['|','|'],['\\','\\'],['←','L'],['→','R'],['↑','U'],['↓','D']];
$('#sym').innerHTML=SY.map((s,i)=>'<button class="b" data-i="'+i+'">'+esc(s[0])+'</button>').join('');
$('#sym').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-i]');if(!b)return;e.preventDefault();
  const x=SY[+b.dataset.i][1];ed.focus();
  if(x==='T')ed.insert('  ');else if(x==='L')ed.navigateLeft(1);else if(x==='R')ed.navigateRight(1);else if(x==='U')ed.navigateUp(1);else if(x==='D')ed.navigateDown(1);
  else if(x==='<>'||x==='``'){ed.insert(x);ed.navigateLeft(1)}else ed.insert(x)});

/* barra de ferramentas */
$('#tl').addEventListener('pointerdown',e=>{if(e.target.closest('[data-t]'))e.preventDefault()});
$('#tl').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
  if(t==='undo')ed.undo();else if(t==='redo')ed.redo();
  else if(t==='find')ed.execCommand('find');else if(t==='goto')ed.execCommand('gotoline');
  else if(t==='sel')ed.selectMore(1);else if(t==='cmt')ed.toggleCommentLines();else if(t==='fold')ed.execCommand('toggleFold');
  else if(t==='wrap')ed.session.setUseWrapMode(!ed.session.getUseWrapMode());
  else if(t==='a+')ed.setFontSize(Math.min(26,ed.getFontSize()+1));else if(t==='a-')ed.setFontSize(Math.max(9,ed.getFontSize()-1));
  else if(t==='copy')copy(ed.getSelectedText()||ed.getValue());
  else if(t==='vault')addVault(ed.getSelectedText()||ed.getValue(),F().n);
  else if(t==='dl')dl(F().n,ed.getValue())};

/* executar */
$('#run').onclick=()=>{const f=F(),x=ext(f.n),c=ed.getValue();let h;
  if(x==='html'||x==='htm')h=c;
  else if(x==='js')h='<body style="background:#030a1c;color:#9fe8ff;font:13px monospace;padding:12px"><pre id=o></pre><script>const o=document.getElementById("o"),p=(...a)=>o.textContent+=a.map(x=>typeof x==="object"?JSON.stringify(x):x).join(" ")+"\\n";console.log=p;console.error=p;onerror=m=>p("ERRO: "+m);try{'+c.replace(/<\/script/gi,'<\\/script')+'}catch(e){p("ERRO: "+e.message)}<\/script>';
  else if(x==='css')h='<style>'+c+'</style><h1>Título</h1><p>Texto de exemplo.</p><button>Botão</button>';
  else h='<pre style="font:13px monospace;white-space:pre-wrap;padding:12px">'+esc(c)+'</pre>';
  $('#fr2').srcdoc=h;$('#pvn').textContent=f.n;$('#pv').classList.add('on')};
$('#pvx').onclick=()=>{$('#pv').classList.remove('on');$('#fr2').srcdoc=''};

/* arquivos */
function openFile(id){cur=id;ed.setSession(sess(F()));$('#fn').value=F().n;saveSoon();stat();show('ed')}
function renderFiles(){$('#fls').innerHTML=files.map(f=>'<div class="it cp" data-id="'+f.id+'"><div class="t" data-a="open"><b>'+esc(f.n)+'</b><small>'+(f.id===cur?'aberto · ':'')+val(f).length+' caracteres</small></div><button class="b" data-a="dl">BAIXAR</button><button class="b d" data-a="rm">APAGAR</button></div>').join('')||'<p class="em">Nenhum arquivo.</p>'}
$('#fls').onclick=e=>{const it=e.target.closest('.it'),a=e.target.closest('[data-a]');if(!it||!a)return;const f=files.find(x=>x.id===it.dataset.id);
  if(a.dataset.a==='open')openFile(f.id);
  else if(a.dataset.a==='dl')dl(f.n,val(f));
  else if(a.dataset.a==='rm'){if(!confirm('Apagar '+f.n+'?'))return;files=files.filter(x=>x!==f);delete SS[f.id];if(!files.length)files.push({id:uid(),n:'novo.txt',c:''});if(cur===f.id){cur=files[0].id;ed.setSession(sess(F()));$('#fn').value=F().n}sv('files',files.map(({id,n,c})=>({id,n,c})));renderFiles()}};
$('#nw').onclick=()=>{const n=prompt('Nome do arquivo:','novo.html');if(!n)return;const f={id:uid(),n:n.trim(),c:''};files.push(f);openFile(f.id)};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async()=>{for(const f of $('#fi').files)files.push({id:uid(),n:f.name,c:await f.text()});$('#fi').value='';sv('files',files.map(({id,n,c})=>({id,n,c})));renderFiles();toast('Importado')};
$('#dall').onclick=()=>files.forEach((f,i)=>setTimeout(()=>dl(f.n,val(f)),i*400));

/* ===== COFRE: códigos criptografados (AES-256 + PBKDF2) que só abrem com a sua senha ===== */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=a=>{a=new Uint8Array(a);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let K=null,items=[],V=ld('vault',null),idle,q='';
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(JSON.stringify(items)));V={s:V.s,i:b64(iv),d:b64(ct)};sv('vault',V)}
function touch(){clearTimeout(idle);if(K)idle=setTimeout(lock,120000)}
function lock(){K=null;items=[];q='';renderV()}
document.addEventListener('pointerdown',touch);
document.addEventListener('visibilitychange',()=>{if(!K)return;clearTimeout(idle);if(document.hidden)idle=setTimeout(lock,60000);else touch()});
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M6 11h12l2 2v6l-2 2H6l-2-2v-6z"/><path d="M12 15v2"/></svg>';
function renderV(){const bx=$('#cfb');
  if(!K){bx.innerHTML='<div class="lk cp" id="lkb">'+LOCK+'<h2>'+(V?'COFRE TRANCADO':'CRIAR COFRE')+'</h2><p>'+(V?'Digite sua senha para ver seus códigos.':'Escolha uma senha. Seus códigos ficam criptografados neste aparelho. Se esquecer a senha, não há como recuperar.')+'</p><input type="password" id="pw" placeholder="Senha" autocomplete="off">'+(V?'':'<input type="password" id="pw2" placeholder="Repita a senha" autocomplete="off">')+'<button class="b g" id="go">'+(V?'DESTRANCAR':'CRIAR COFRE')+'</button>'+(V?'<button class="b d" id="wp">APAGAR COFRE</button>':'')+'</div>';return}
  const L=items.filter(x=>!q||(x.n+x.c).toLowerCase().includes(q));
  bx.innerHTML='<div class="row"><button class="b g" id="cps">COLAR DA ÁREA</button><button class="b" id="lkk">TRANCAR</button></div><input type="text" id="qs" placeholder="Buscar no cofre…" value="'+esc(q).replace(/"/g,'&quot;')+'" style="margin-bottom:8px">'+
  (L.map(x=>'<div class="cl cp" data-id="'+x.id+'"><h4>'+esc(x.n)+'</h4><pre>'+esc(x.c.slice(0,260))+'</pre><div class="row"><button class="b" data-a="cp">COPIAR</button><button class="b g" data-a="ed">ABRIR NO EDITOR</button><button class="b" data-a="rn">RENOMEAR</button><button class="b d" data-a="rm">APAGAR</button></div></div>').join('')||'<p class="em">'+(items.length?'Nada encontrado.':'Cofre vazio. Use → COFRE no editor ou COLAR DA ÁREA.')+'</p>')}
async function addVault(t,n){if(!K){toast('Destranque o cofre primeiro');show('cf');return}if(!t.trim())return;
  items.unshift({id:uid(),n:n||t.trim().split('\n')[0].slice(0,32)||'sem título',c:t});await seal();renderV();toast('Guardado no cofre')}
$('#cfb').onclick=async e=>{const id=e.target.id;
  if(id==='go'){const pw=$('#pw').value,bx=$('#lkb');
    try{if(!V){if(pw.length<4)return toast('Mínimo de 4 caracteres');if(pw!==$('#pw2').value)return toast('As senhas não batem');const s=crypto.getRandomValues(new Uint8Array(16));K=await derive(pw,s);V={s:b64(s)};items=[];await seal()}
      else{K=await derive(pw,ub(V.s));items=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(V.i)},K,ub(V.d))))}
      touch();renderV()}catch(x){K=null;bx.classList.remove('sh');void bx.offsetWidth;bx.classList.add('sh');toast('Senha errada')}return}
  if(id==='wp'){if(confirm('Apagar o cofre e TODOS os códigos dele? Isso não tem volta.')){localStorage.removeItem('js_vault');V=null;renderV()}return}
  if(id==='lkk'){lock();return}
  if(id==='cps'){try{addVault(await navigator.clipboard.readText())}catch(x){const t=prompt('O navegador bloqueou a leitura. Cole aqui:');if(t)addVault(t)}return}
  const a=e.target.closest('[data-a]'),it=e.target.closest('.cl');if(!a||!it)return;const x=items.find(i=>i.id===it.dataset.id);
  if(a.dataset.a==='cp')copy(x.c);
  else if(a.dataset.a==='ed'){const f={id:uid(),n:x.n.includes('.')?x.n:x.n+'.txt',c:x.c};files.push(f);openFile(f.id)}
  else if(a.dataset.a==='rn'){const n=prompt('Novo nome:',x.n);if(n){x.n=n;await seal();renderV()}}
  else if(a.dataset.a==='rm'){if(confirm('Apagar do cofre?')){items=items.filter(i=>i!==x);await seal();renderV()}}};
$('#cfb').oninput=e=>{if(e.target.id==='qs'){q=e.target.value.toLowerCase();const p=e.target.selectionStart;renderV();const n=$('#qs');n.focus();n.setSelectionRange(p,p)}};
$('#cfb').onkeydown=e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('pw'))$('#go').click()};

/* abas */
function show(k){document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id==='v-'+k));document.querySelectorAll('nav .b').forEach(b=>b.classList.toggle('on',b.dataset.v===k));
  if(k==='fl')renderFiles();if(k==='cf')renderV();if(k==='ed'){ed.resize();stat()}}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b)show(b.dataset.v)};
addEventListener('message',e=>{if(e.data==='cofre')show('cf')});
if(ld('goto',null)==='cofre'){sv('goto',null);show('cf')}
stat();
</script>
