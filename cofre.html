<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010510"><title>COFRE</title>
<style>
:root{color-scheme:dark;--a:#2fd8ff;--g:#7dffb2;--r:#ff6b8a;--m:#6f9fd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#010510;color:#dff6ff;font:15px system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(70% 40% at 50% 0,rgba(47,216,255,.2),transparent 70%),#010510}
header{display:flex;align-items:center;gap:10px;padding:10px 12px}
header a{color:var(--a);text-decoration:none;font-weight:700;padding:8px 14px;background:rgba(47,216,255,.12);border-radius:8px}
header h1{flex:1;margin:0;font:900 13px system-ui;letter-spacing:.3em;color:var(--a)}
.bar{display:flex;gap:8px;padding:0 12px 8px}
button{border:0;border-radius:8px;padding:11px 14px;font:600 13px system-ui;color:var(--a);background:rgba(61,155,255,.2)}
button:active{background:var(--a);color:#001}.g{color:var(--g)}.d{color:var(--r)}
input,textarea{width:100%;border:0;outline:0;border-radius:8px;background:rgba(36,89,232,.18);color:#dff6ff;font:15px ui-monospace,monospace;padding:12px}
#q{flex:1}
#ls{flex:1;overflow-y:auto;padding:0 12px 12px}
.it{background:rgba(10,29,77,.7);border:1px solid rgba(47,216,255,.25);border-radius:10px;padding:12px;margin-bottom:10px}
.it b{color:var(--a);font:600 14px ui-monospace,monospace}
.it pre{margin:6px 0 10px;font:12px/1.45 ui-monospace,monospace;color:#cfe9ff;white-space:pre-wrap;word-break:break-all;max-height:90px;overflow:hidden}
.it div{display:flex;gap:6px;flex-wrap:wrap}
.em{color:var(--m);text-align:center;padding:40px 10px}
#ed{display:none;position:fixed;inset:0;background:#010510;padding:env(safe-area-inset-top) 12px 12px;flex-direction:column;gap:8px;z-index:5}
#ed.on{display:flex}#ed textarea{flex:1;resize:none}
#ts{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--a);color:#001;padding:10px 20px;border-radius:8px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}#ts.on{opacity:1}
</style></head><body>
<header><a href="index.html">‹ JARVIS</a><h1>COFRE</h1></header>
<div class="bar"><button class="g" id="paste">COLAR</button><button id="new">+ NOVO</button><input id="q" placeholder="Buscar…"></div>
<div id="ls"></div>
<div id="ed"><input id="en" placeholder="Nome"><textarea id="ec" placeholder="Código…" spellcheck="false" autocapitalize="off"></textarea>
<div class="bar" style="padding:0"><button class="g" id="sv" style="flex:1">SALVAR</button><button id="cx" style="flex:1">CANCELAR</button></div></div>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s),K='cofre_items';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let items=[];try{items=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
let eid=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch(e){toast('Armazenamento cheio')}};
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1500)}
function render(){const q=$('#q').value.toLowerCase(),L=items.filter(x=>!q||(x.n+x.c).toLowerCase().includes(q));
  $('#ls').innerHTML=L.map(x=>'<div class="it" data-id="'+x.id+'"><b>'+esc(x.n)+'</b><pre>'+esc(x.c.slice(0,240))+'</pre><div><button data-a="cp">COPIAR</button><button data-a="ed">EDITAR</button><button class="d" data-a="rm">APAGAR</button></div></div>').join('')||'<p class="em">Cofre vazio. Toque em COLAR ou + NOVO.</p>'}
function openEd(x){eid=x?x.id:null;$('#en').value=x?x.n:'';$('#ec').value=x?x.c:'';$('#ed').classList.add('on')}
$('#new').onclick=()=>openEd();
$('#cx').onclick=()=>$('#ed').classList.remove('on');
$('#sv').onclick=()=>{const c=$('#ec').value;if(!c.trim())return toast('Vazio');const n=$('#en').value.trim()||c.trim().split('\n')[0].slice(0,32);
  const x=items.find(i=>i.id===eid);if(x){x.n=n;x.c=c}else items.unshift({id:uid(),n,c});save();$('#ed').classList.remove('on');render();toast('Salvo')};
$('#paste').onclick=async()=>{let t='';try{t=await navigator.clipboard.readText()}catch(e){t=prompt('Cole aqui:')||''}
  if(t.trim()){items.unshift({id:uid(),n:t.trim().split('\n')[0].slice(0,32),c:t});save();render();toast('Guardado')}};
$('#q').oninput=render;
$('#ls').onclick=e=>{const b=e.target.closest('[data-a]'),it=e.target.closest('.it');if(!b)return;const x=items.find(i=>i.id===it.dataset.id);
  if(b.dataset.a==='cp')navigator.clipboard.writeText(x.c).then(()=>toast('Copiado')).catch(()=>toast('Falhou'));
  else if(b.dataset.a==='ed')openEd(x);
  else if(confirm('Apagar?')){items=items.filter(i=>i!==x);save();render()}};
render();
</script></body></html>
