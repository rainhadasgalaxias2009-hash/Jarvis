<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#010509;--fg:#d6f6ff;--mut:#5d9bb8;--ac:#2fd8ff;--ac2:#7dffb2;--card:#04101ccc;--bd:#0e4668;
--hud:Orbitron,"Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 28%,#06324f 0,#02101c 45%,var(--bg) 80%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;position:relative}
#net{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(transparent 0 2px,#0003 3px),radial-gradient(ellipse at center,transparent 55%,#000a 100%);pointer-events:none}
header{display:flex;justify-content:space-between;padding:10px 16px 0;font:500 10px var(--hud);letter-spacing:.35em;color:var(--ac);text-shadow:0 0 8px var(--ac);z-index:2}
#hud{position:relative;width:min(88vw,340px);aspect-ratio:1;margin:4px auto 0;z-index:2;flex:none}
#hud svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#hud::before{content:"";position:absolute;inset:-12%;background:radial-gradient(circle,#2fd8ff40,#2fd8ff0d 55%,transparent 70%);z-index:-1}
#hud g.s{transform-box:fill-box;transform-origin:center}
.a1{animation:sp 60s linear infinite}.a2{animation:sp 22s linear infinite reverse}.a3{animation:sp 14s linear infinite}.a4{animation:sp 9s linear infinite reverse}.a5{animation:sp 30s linear infinite}
#hud.on .a2,#hud.on .a4,#hud.sp .a2,#hud.sp .a4{animation-duration:3s}
#hud.on .a3,#hud.sp .a3{animation-duration:4s}
@keyframes sp{to{transform:rotate(360deg)}}
#core{fill:#2fd8ff;opacity:.16;animation:br 3s ease-in-out infinite}
#hud.on #core,#hud.sp #core{opacity:.45;animation-duration:.7s}
#hud.sp::before{background:radial-gradient(circle,#7dffb240,#7dffb20d 55%,transparent 70%)}
#hud.sp svg *[stroke="#2fd8ff"]{stroke:#7dffb2}
@keyframes br{50%{opacity:.34}}
.flare{position:absolute;left:-30%;right:-30%;top:50%;height:3px;margin-top:-1px;background:linear-gradient(90deg,transparent,#2fd8ff88 30%,#fff 50%,#2fd8ff88 70%,transparent);box-shadow:0 0 36px 12px #2fd8ff66;border-radius:50%;animation:fl 5s ease-in-out infinite;pointer-events:none}
#hud.on .flare,#hud.sp .flare{animation-duration:1.2s}
@keyframes fl{0%,100%{transform:scaleX(.35);opacity:.55}50%{transform:scaleX(1);opacity:1}}
#orb{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;color:#e8fbff;font:800 clamp(8px,2.6vw,11px) var(--hud);letter-spacing:.14em;text-shadow:0 0 10px var(--ac),0 0 22px var(--ac);padding:0}
#orb.talk{color:var(--ac2);text-shadow:0 0 12px var(--ac2)}
#st{text-align:center;font:500 10px var(--hud);letter-spacing:.2em;color:var(--mut);min-height:14px;padding:0 14px;z-index:2}
#eq{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:22px;z-index:2;margin:2px 0}
#eq i{width:3px;height:3px;background:var(--ac);border-radius:2px;box-shadow:0 0 6px var(--ac)}
#hud.sp~#eq i,#hud.on~#eq i{animation:eq .5s ease-in-out infinite alternate}
#eq i:nth-child(3n){animation-delay:.1s!important}#eq i:nth-child(3n+1){animation-delay:.25s!important}
@keyframes eq{to{height:20px}}
#log{flex:1;min-height:0;overflow-y:auto;padding:6px 14px;display:flex;flex-direction:column;gap:8px;z-index:2}
.m{max-width:88%;padding:8px 13px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;border:1px solid var(--bd);background:var(--card);border-radius:10px}
.u{align-self:flex-end;border-color:#2fd8ff99;background:#06344a99;color:#fff}
.j{align-self:flex-start;border-radius:4px 14px 14px 14px;border-left:3px solid var(--ac2);box-shadow:0 0 16px #2fd8ff18}
.go{display:inline-block;margin-top:6px;padding:8px 14px;border:1px solid var(--ac2);color:var(--ac2);font:500 11px var(--hud);letter-spacing:.12em;text-decoration:none;background:#7dffb214;animation:gl 1.6s ease-in-out infinite alternate}
@keyframes gl{to{box-shadow:0 0 20px #7dffb2aa}}
.bar{display:flex;gap:8px;padding:6px 14px 2px;z-index:2}
.bar input[type=text]{flex:1;min-width:0;background:#04101ccc;border:1px solid var(--bd);color:var(--fg);padding:11px 15px;font-size:16px;outline:none;border-radius:22px}
.bar input[type=text]:focus{border-color:var(--ac);box-shadow:0 0 12px #2fd8ff55}
.bar button{background:var(--ac);border:0;color:#012;font:800 11px var(--hud);letter-spacing:.1em;padding:0 18px;border-radius:22px}
.row{display:flex;justify-content:center;align-items:center;gap:14px;padding:4px 0 10px;z-index:2}
.tg{display:flex;align-items:center;gap:6px;font:500 9px var(--hud);letter-spacing:.1em;color:var(--mut)}
.tg input{accent-color:var(--ac)}
#vb{background:transparent;border:1px solid var(--ac);color:var(--ac);font:500 9px var(--hud);letter-spacing:.12em;padding:6px 12px;border-radius:14px}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.pn{position:absolute;top:56px;width:92px;padding:8px 10px;border:1px solid #2fd8ff44;background:linear-gradient(#2fd8ff12,transparent);font:500 8px var(--hud);letter-spacing:.14em;color:var(--mut);line-height:1.9}
.pn b{display:block;color:var(--ac);font-weight:500}.pn span{display:block;color:#bff3ff;margin-bottom:2px}
.pl{left:10px;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.pr{right:10px;text-align:right;clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px))}
.cb{position:absolute;width:26px;height:26px;border:2px solid #2fd8ffaa}
.c1{left:8px;top:8px;border-right:0;border-bottom:0}.c2{right:8px;top:8px;border-left:0;border-bottom:0}.c3{left:8px;bottom:8px;border-right:0;border-top:0}.c4{right:8px;bottom:8px;border-left:0;border-top:0}
.scan{position:absolute;top:0;left:0;right:0;height:90px;will-change:transform;background:linear-gradient(transparent,#2fd8ff1c,transparent);animation:sc 7s linear infinite}
@keyframes sc{from{transform:translateY(-90px)}to{transform:translateY(100vh)}}
.glow{position:absolute;left:-20%;right:-20%;bottom:-18%;height:45%;background:radial-gradient(ellipse at center,#0a6a9a55,transparent 70%)}
#hud.boot svg{animation:bi 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes bi{from{transform:scale(.15) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
#boot{position:fixed;inset:0;z-index:50;background:#000;clip-path:circle(150% at 50% 30%);transition:clip-path 1.3s cubic-bezier(.7,0,.2,1)}
#bc{position:absolute;inset:0;width:100%;height:100%}
#bt{position:absolute;left:0;right:0;text-align:center;font:800 clamp(14px,5vw,20px) var(--hud);letter-spacing:.32em;color:#e8fbff;text-shadow:0 0 14px var(--ac),0 0 34px var(--ac);transform:translateY(-50%);padding-left:.32em}
#bt.idle{animation:bk 1.3s infinite;font-size:11px;color:var(--ac)}
@keyframes bk{50%{opacity:.25}}
#bl{position:absolute;left:50%;transform:translateX(-50%);font:500 10px var(--hud);letter-spacing:.16em;color:var(--ac2);white-space:pre;text-align:left;line-height:19px;text-shadow:0 0 8px #7dffb288}
#bp{position:absolute;left:50%;transform:translateX(-50%);width:min(70vw,260px);height:3px;background:#2fd8ff22;opacity:0}
#bp i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 12px var(--ac)}
#bs{position:absolute;left:0;right:0;text-align:center;font:800 clamp(12px,4vw,16px) var(--hud);letter-spacing:.3em;color:var(--ac2);text-shadow:0 0 16px var(--ac2);opacity:0}
#sk{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:500 9px var(--hud);letter-spacing:.3em;color:#5d9bb8;opacity:0;transition:opacity .4s}
#bs.on{opacity:1;animation:gt .5s steps(2) 2}
@keyframes gt{0%{transform:translate(0)}25%{transform:translate(-4px,1px);filter:hue-rotate(60deg)}50%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}100%{transform:none}}
</style>
</head>

<div id="bg"><div class="glow"></div>
<svg><defs><pattern id="hx" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(.9)"><path d="M28 0l28 16v32L28 64 0 48V16zM28 64v33M0 48l-0 0M56 48v0" fill="none" stroke="#2fd8ff" stroke-opacity=".16" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#hx)"/></svg>

<script>
(()=>{const c=document.getElementById('net'),x=c.getContext('2d');let W,H,P=[];
function rs(){const d=1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);P=Array.from({length:Math.round(W*H/45000)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
rs();addEventListener('resize',rs);
(function f(){x.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
for(let i=0;i<P.length;i++){const a=P[i];x.fillStyle='#2fd8ff';x.fillRect(a.x-1,a.y-1,2,2);
for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){x.strokeStyle='rgba(47,216,255,'+(.35*(1-d/120))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
requestAnimationFrame(f)})()})();
</script>
<script>
const $=s=>document.querySelector(s);
const log=$('#log'),st=$('#st'),orb=$('#orb'),hud=$('#hud'),cont=$('#cont');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const AND=/android/i.test(navigator.userAgent),IOS=/iphone|ipad/i.test(navigator.userAgent);
let hist=[],listening=false,speaking=false,rec=null,sample=null,voice=null;
setInterval(()=>$('#clk').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),1000);

const APPS={whatsapp:['com.whatsapp','whatsapp://'],instagram:['com.instagram.android','instagram://'],youtube:['com.google.android.youtube','youtube://'],spotify:['com.spotify.music','spotify://'],tiktok:['com.zhiliaoapp.musically','snssdk1233://'],facebook:['com.facebook.katana','fb://'],messenger:['com.facebook.orca','fb-messenger://'],telegram:['org.telegram.messenger','tg://'],twitter:['com.twitter.android','twitter://'],x:['com.twitter.android','twitter://'],netflix:['com.netflix.mediaclient','nflx://'],gmail:['com.google.android.gm','googlegmail://'],maps:['com.google.android.apps.maps','comgooglemaps://'],uber:['com.ubercab','uber://'],ifood:['br.com.brainweb.ifood','ifood://'],nubank:['com.nu.production','nubank://'],camera:['','camera://'],relogio:['com.google.android.deskclock','clock-alarm://'],fotos:['com.google.android.apps.photos','photos-redirect://'],discord:['com.discord','discord://'],chrome:['com.android.chrome','googlechrome://'],waze:['com.waze','waze://'],kwai:['com.kwai.video','kwai://'],pix:['','']};
const CFG={wifi:'android.settings.WIFI_SETTINGS',bluetooth:'android.settings.BLUETOOTH_SETTINGS',aviao:'android.settings.AIRPLANE_MODE_SETTINGS',dados:'android.settings.DATA_ROAMING_SETTINGS',tela:'android.settings.DISPLAY_SETTINGS',som:'android.settings.SOUND_SETTINGS',bateria:'android.settings.BATTERY_SAVER_SETTINGS',localizacao:'android.settings.LOCATION_SOURCE_SETTINGS',configuracoes:'android.settings.SETTINGS',alarme:'android.intent.action.SHOW_ALARMS',internet:'android.settings.WIRELESS_SETTINGS',nfc:'android.settings.NFC_SETTINGS',nao_perturbe:'android.settings.ZEN_MODE_SETTINGS'};
const IOSCFG={wifi:'App-Prefs:WIFI',bluetooth:'App-Prefs:Bluetooth',configuracoes:'App-Prefs:',tela:'App-Prefs:DISPLAY',bateria:'App-Prefs:BATTERY_USAGE',internet:'App-Prefs:MOBILE_DATA_SETTINGS_ID'};

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[?!.,]/g,'').trim()}
function add(t,c,node){const d=document.createElement('div');d.className='m '+c;if(node)d.append(node);else d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight;return d}
let voiceName=null;try{voiceName=localStorage.getItem('jv')}catch(e){}
function ptVoices(){return speechSynthesis.getVoices().filter(x=>/pt[-_]?BR/i.test(x.lang)||/portugu/i.test(x.name))}
function pick(){const v=ptVoices();voice=v.find(x=>x.name===voiceName)||v.find(x=>/male|masc|ricardo|daniel|felipe|antonio|luciano|diego|HD/i.test(x.name)&&!/female|feminin/i.test(x.name))||v[0]||speechSynthesis.getVoices().find(x=>/^pt/i.test(x.lang))||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}

/* ===== MODO INDEPENDENTE ===== */
const CLIPS={/* 'frase exata em minúsculas, sem pontuação final':'voz/arquivo.mp3' */};
const normClip=t=>t.toLowerCase().replace(/[.!?…]+$/,'').trim();
function playClip(t){const f=CLIPS[normClip(t)];if(!f)return null;
  return new Promise(res=>{const a=new Audio(f);a.onplay=()=>{speaking=true;orb.className='talk';hud.classList.add('sp');st.textContent='FALANDO'};
  const end=()=>{speaking=false;orb.className='';hud.classList.remove('sp');st.textContent='AGUARDANDO COMANDO';res(true)};
  a.onended=end;a.onerror=()=>res(false);a.play().catch(()=>res(false))})}
function geminiSample(){
  return async(msgs)=>{
    let k='';try{k=localStorage.getItem('gk')||''}catch(e){}
    if(!k){k=prompt('Cole sua chave grátis do Google AI Studio (aistudio.google.com):')||'';if(!k)throw new Error('sem chave');try{localStorage.setItem('gk',k.trim())}catch(e){}}
    let m='gemini-3.5-flash-lite';try{m=localStorage.getItem('gm')||m}catch(e){}
    const contents=msgs.map(x=>({role:x.role==='assistant'?'model':'user',parts:[{text:x.content}]}));
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k.trim()},body:JSON.stringify({contents})});
    if(!r.ok){if(r.status===400||r.status===403)try{localStorage.removeItem('gk')}catch(e){}throw new Error('HTTP '+r.status)}
    const j=await r.json();return{text:(j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(p=>p.text||'').join(''))||''}}}
function say(t,quiet){
  if(!quiet)add(t,'j');
  {const c=playClip(t);if(c)return c.then(ok=>ok?undefined:say2(t))}
  return say2(t);
}
function say2(t){
  if(!('speechSynthesis' in window)){add('Este navegador não tem voz falada. Abra o link no Chrome.','j');return Promise.resolve()}
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  const parts=t.replace(/[*#_`]/g,'').match(/[^.!?…]+[.!?…]*/g)||[t];
  return new Promise(res=>{let i=0;
    const end=()=>{speaking=false;orb.className='';hud.classList.remove('sp');st.textContent='AGUARDANDO COMANDO';res()};
    const next=()=>{if(i>=parts.length)return end();
      const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang='pt-BR';if(voice)u.voice=voice;u.rate=.93;u.pitch=.6;u.volume=1;
      u.onstart=()=>{speaking=true;orb.className='talk';hud.classList.add('sp');st.textContent='FALANDO'};
      u.onend=()=>setTimeout(next,160);
      u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled'){i=parts.length;return end()}
        if(!u._r){u._r=1;const v=new SpeechSynthesisUtterance(u.text);v.lang='pt-BR';v.onend=()=>setTimeout(next,160);v.onerror=()=>{i=parts.length;end();st.textContent='ERRO DE VOZ: '+(e.error||'?')};speechSynthesis.speak(v)}};
      speechSynthesis.speak(u)};
    next()})
}
function launch(url,label,speech){
  const a=document.createElement('a');a.className='go';a.href=url;a.target='_blank';a.rel='noopener';a.textContent='▶ EXECUTAR: '+label.toUpperCase();
  const wrap=document.createElement('span');wrap.append(a);
  add('','j',wrap);
  try{const w=window.open(url,'_blank','noopener');if(!w)throw 0}catch(e){}
  return say(speech||('Pronto. Toque em executar para abrir '+label+'.'),true);
}
function intent(action,extra){return 'intent:#Intent;action='+action+';'+(extra||'')+'end'}
function doAction(a){
  if(!a||!a.tipo||a.tipo==='nenhuma')return;
  const k=norm(a.alvo||'').replace(/\s/g,'_');
  if(a.tipo==='config'){
    if(AND&&CFG[k])return launch(intent(CFG[k]),'configuração '+k);
    if(IOS&&IOSCFG[k])return launch(IOSCFG[k],'configuração '+k);
    return launch(AND?intent('android.settings.SETTINGS'):'App-Prefs:','configurações');
  }
  if(a.tipo==='app'){
    const key=Object.keys(APPS).find(x=>k.includes(x));
    if(key){const [pkg,sch]=APPS[key];
      if(AND&&pkg)return launch('intent://#Intent;package='+pkg+';action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end',key);
      if(sch)return launch(sch,key)}
    return launch('https://www.google.com/search?q='+encodeURIComponent(a.alvo),a.alvo);
  }
  if(a.tipo==='url')return launch(/^https?:/.test(a.alvo)?a.alvo:'https://'+a.alvo,a.alvo);
  if(a.tipo==='pesquisa')return launch('https://www.google.com/search?q='+encodeURIComponent(a.alvo),'pesquisa');
  if(a.tipo==='musica')return launch('https://www.youtube.com/results?search_query='+encodeURIComponent(a.alvo),'música');
  if(a.tipo==='rota')return launch('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a.alvo),'rota');
  if(a.tipo==='ligar')return launch('tel:'+String(a.alvo).replace(/[^\d+]/g,''),'ligação');
  if(a.tipo==='sms')return launch('sms:'+String(a.alvo).replace(/[^\d+]/g,'')+(a.texto?'?body='+encodeURIComponent(a.texto):''),'SMS');

function local(raw){
  const s=norm(raw);
  if(/que horas/.test(s))return say('Agora são '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+', senhor.');
  if(/que dia|data de hoje/.test(s))return say('Hoje é '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+', senhor.');
  if(/^(parar|para|silencio|calar)$/.test(s)){speechSynthesis.cancel();return say('Silêncio, senhor.')}
  if(/^(limpar|esquecer)( conversa| tudo)?$/.test(s)){hist=[];log.innerHTML='';return say('Memória da conversa apagada, senhor.')}
  return null;
}

  try{

    let j;try{j=JSON.parse(out.text.replace(/```json|```/g,'').trim())}catch(e){j={fala:out.text,acao:{tipo:'nenhuma'}}}

}

function listen(){

  let final='';

  rec.onresult=e=>{let i='';for(const r of e.results){if(r.isFinal)final+=r[0].transcript;else i+=r[0].transcript}st.textContent='“'+(final+i).toUpperCase()+'”'};
  rec.onerror=e=>{st.textContent=e.error==='not-allowed'?'PERMITA O MICROFONE':'NADA OUVIDO'};
  rec.onend=async()=>{
    listening=false;orb.className='';orb.textContent='J.A.R.V.I.S';hud.className='';
    const t=final.trim();
    if(cont.checked){
      if(t&&/jarvis|jarves/.test(norm(t)))await handle(t.replace(/^.*?(jarvis|jarves)[ ,]*/i,''));
      setTimeout(()=>{if(cont.checked&&!listening&&!speaking)listen()},400);
    }else if(t)handle(t);
  };
  try{rec.start()}catch(e){}
}
